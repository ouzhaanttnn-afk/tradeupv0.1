<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .category-bg { fill: #eff6ff; }
      .category-accent { fill: #dbeafe; }
      .category-icon { fill: #3b82f6; }
      .category-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e40af; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" class="category-bg" />
  <circle cx="256" cy="256" r="180" class="category-accent" opacity="0.5" />

  <!-- Electronics icon: smartphone -->
  <g transform="translate(256, 200)">
    <rect x="-60" y="-80" width="120" height="160" rx="12" fill="none" stroke="#3b82f6" stroke-width="4" />
    <circle cx="0" cy="55" r="8" fill="#3b82f6" opacity="0.5" />
    <rect x="-45" y="-60" width="90" height="100" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Category label -->
  <text x="256" y="420" font-size="20" font-weight="600" text-anchor="middle" class="category-text">Electronics</text>
  <text x="256" y="450" font-size="13" text-anchor="middle" class="category-text" opacity="0.7">Loading product image</text>
</svg>
