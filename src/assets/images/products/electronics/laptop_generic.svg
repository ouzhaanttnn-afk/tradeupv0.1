<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .laptop-body { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .laptop-screen { fill: #0f172a; stroke: #374151; stroke-width: 2; }
      .laptop-accent { fill: #3b82f6; }
      .keyboard-key { fill: #2d3748; stroke: #1a202c; stroke-width: 1; }
    </style>
  </defs>

  <!-- Laptop screen panel -->
  <rect x="40" y="20" width="432" height="240" rx="8" class="laptop-screen" />

  <!-- Screen content simulation -->
  <defs>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="50" y="30" width="412" height="220" fill="url(#screen-grad)" />

  <!-- Menu bar simulation -->
  <rect x="55" y="35" width="402" height="15" fill="#1a202c" opacity="0.8" />
  <text x="60" y="45" font-size="8" fill="#64748b">TradeUp Market</text>

  <!-- Content area with grid -->
  <rect x="60" y="60" width="80" height="60" rx="4" class="laptop-accent" opacity="0.7" />
  <rect x="160" y="60" width="80" height="60" rx="4" fill="#ef4444" opacity="0.7" />
  <rect x="260" y="60" width="80" height="60" rx="4" fill="#10b981" opacity="0.7" />
  <rect x="360" y="60" width="80" height="60" rx="4" fill="#f59e0b" opacity="0.7" />

  <rect x="60" y="140" width="80" height="60" rx="4" fill="#8b5cf6" opacity="0.7" />
  <rect x="160" y="140" width="80" height="60" rx="4" fill="#ec4899" opacity="0.7" />
  <rect x="260" y="140" width="80" height="60" rx="4" fill="#06b6d4" opacity="0.7" />
  <rect x="360" y="140" width="80" height="60" rx="4" fill="#6366f1" opacity="0.7" />

  <!-- Laptop base -->
  <path d="M 30 260 L 50 280 L 462 280 L 482 260 Z" class="laptop-body" />

  <!-- Keyboard simulation -->
  <rect x="60" y="270" width="392" height="15" fill="#1a202c" />

  <!-- Keyboard keys -->
  <rect x="70" y="273" width="8" height="8" class="keyboard-key" />
  <rect x="82" y="273" width="8" height="8" class="keyboard-key" />
  <rect x="94" y="273" width="8" height="8" class="keyboard-key" />
  <rect x="106" y="273" width="8" height="8" class="keyboard-key" />

  <!-- Touchpad -->
  <rect x="380" y="267" width="60" height="20" rx="2" fill="#2d3748" stroke="#374151" stroke-width="1" />

  <!-- Hinge -->
  <line x1="40" y1="260" x2="472" y2="260" stroke="#374151" stroke-width="2" />
</svg>
