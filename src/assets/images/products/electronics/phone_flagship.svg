<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .phone-body { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .phone-screen { fill: #0f172a; stroke: #1e293b; stroke-width: 1; }
      .phone-accent { fill: #3b82f6; }
      .phone-camera { fill: #374151; }
      .phone-reflection { fill: white; opacity: 0.15; }
    </style>
  </defs>

  <!-- Phone body -->
  <rect x="20" y="30" width="216" height="452" rx="20" class="phone-body" />

  <!-- Screen display -->
  <rect x="30" y="50" width="196" height="380" rx="16" class="phone-screen" />

  <!-- Status bar simulation -->
  <rect x="35" y="55" width="186" height="20" fill="#1e293b" opacity="0.8" />
  <text x="40" y="68" font-size="8" fill="#64748b">9:41</text>
  <circle cx="210" cy="62" r="3" fill="#64748b" />

  <!-- Content area with gradient suggestion -->
  <defs>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="35" y="80" width="186" height="340" fill="url(#screen-grad)" />

  <!-- App icons simulation -->
  <rect x="50" y="100" width="30" height="30" rx="6" class="phone-accent" />
  <rect x="90" y="100" width="30" height="30" rx="6" fill="#ef4444" />
  <rect x="130" y="100" width="30" height="30" rx="6" fill="#10b981" />
  <rect x="170" y="100" width="30" height="30" rx="6" fill="#f59e0b" />

  <rect x="50" y="145" width="30" height="30" rx="6" fill="#8b5cf6" />
  <rect x="90" y="145" width="30" height="30" rx="6" fill="#ec4899" />
  <rect x="130" y="145" width="30" height="30" rx="6" fill="#06b6d4" />
  <rect x="170" y="145" width="30" height="30" rx="6" fill="#6366f1" />

  <!-- Camera cluster (top center) -->
  <circle cx="128" cy="65" r="8" class="phone-camera" />
  <circle cx="128" cy="65" r="6" fill="#0f172a" />
  <circle cx="128" cy="65" r="4" class="phone-reflection" />

  <!-- Notch simulation -->
  <rect x="105" y="50" width="46" height="18" rx="8" class="phone-camera" />

  <!-- Bottom bezels with speaker simulation -->
  <rect x="80" y="425" width="96" height="2" rx="1" fill="#374151" opacity="0.8" />

  <!-- Side reflections for 3D effect -->
  <rect x="20" y="50" width="3" height="300" fill="white" opacity="0.08" rx="2" />
  <rect x="236" y="80" width="2" height="250" fill="black" opacity="0.2" />

  <!-- Flagship indicator: premium finish -->
  <circle cx="128" cy="485" r="4" fill="#3b82f6" opacity="0.6" />
</svg>
