<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .watch-body { fill: #1f2937; stroke: #111827; stroke-width: 1.5; }
      .watch-screen { fill: #0f172a; stroke: #374151; stroke-width: 1; }
      .watch-band { fill: #2d3748; }
    </style>
  </defs>

  <!-- Watch body -->
  <rect x="35" y="50" width="90" height="110" rx="12" class="watch-body" />

  <!-- Bezels/lugs for band -->
  <rect x="30" y="60" width="8" height="30" rx="2" class="watch-band" />
  <rect x="122" y="60" width="8" height="30" rx="2" class="watch-band" />
  <rect x="30" y="130" width="8" height="30" rx="2" class="watch-band" />
  <rect x="122" y="130" width="8" height="30" rx="2" class="watch-band" />

  <!-- Screen -->
  <rect x="45" y="60" width="70" height="90" rx="8" class="watch-screen" />

  <!-- Screen content - watch face simulation -->
  <defs>
    <linearGradient id="watch-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="48" y="63" width="64" height="84" fill="url(#watch-grad)" />

  <!-- Digital time display -->
  <text x="80" y="92" font-size="14" font-weight="bold" fill="#3b82f6" text-anchor="middle">9:41</text>

  <!-- Status icons -->
  <circle cx="58" cy="115" r="2" fill="#10b981" opacity="0.8" />
  <circle cx="67" cy="115" r="2" fill="#10b981" opacity="0.8" />
  <circle cx="76" cy="115" r="2" fill="#10b981" opacity="0.8" />

  <!-- Side button -->
  <rect x="135" y="85" width="3" height="18" rx="1.5" fill="#374151" />

  <!-- Watch bands (lower part) -->
  <path d="M 38 160 Q 30 175 35 190" stroke="#2d3748" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M 122 160 Q 130 175 125 190" stroke="#2d3748" stroke-width="4" fill="none" stroke-linecap="round" />
</svg>
