<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .tablet-body { fill: #2d3748; stroke: #1a202c; stroke-width: 2; }
      .tablet-screen { fill: #0f172a; stroke: #374151; stroke-width: 1; }
    </style>
  </defs>

  <!-- Tablet body -->
  <rect x="20" y="15" width="344" height="482" rx="16" class="tablet-body" />

  <!-- Screen -->
  <rect x="35" y="35" width="314" height="442" rx="14" class="tablet-screen" />

  <!-- Status bar -->
  <rect x="45" y="45" width="294" height="20" fill="#1e293b" opacity="0.8" />
  <text x="50" y="58" font-size="9" fill="#64748b">9:41</text>

  <!-- Content area with app grid -->
  <defs>
    <linearGradient id="tablet-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="45" y="70" width="294" height="400" fill="url(#tablet-grad)" />

  <!-- Large grid for tablet (4x3 layout) -->
  <rect x="55" y="85" width="60" height="60" rx="6" fill="#3b82f6" opacity="0.8" />
  <rect x="125" y="85" width="60" height="60" rx="6" fill="#ef4444" opacity="0.8" />
  <rect x="195" y="85" width="60" height="60" rx="6" fill="#10b981" opacity="0.8" />
  <rect x="265" y="85" width="60" height="60" rx="6" fill="#f59e0b" opacity="0.8" />

  <rect x="55" y="160" width="60" height="60" rx="6" fill="#8b5cf6" opacity="0.8" />
  <rect x="125" y="160" width="60" height="60" rx="6" fill="#ec4899" opacity="0.8" />
  <rect x="195" y="160" width="60" height="60" rx="6" fill="#06b6d4" opacity="0.8" />
  <rect x="265" y="160" width="60" height="60" rx="6" fill="#6366f1" opacity="0.8" />

  <rect x="55" y="235" width="60" height="60" rx="6" fill="#14b8a6" opacity="0.8" />
  <rect x="125" y="235" width="60" height="60" rx="6" fill="#f97316" opacity="0.8" />
  <rect x="195" y="235" width="60" height="60" rx="6" fill="#84cc16" opacity="0.8" />
  <rect x="265" y="235" width="60" height="60" rx="6" fill="#a855f7" opacity="0.8" />
</svg>
