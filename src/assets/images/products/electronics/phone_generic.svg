<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#f7f7f8"/><stop offset="60%" stop-color="#ececed"/><stop offset="100%" stop-color="#d8d9dc"/>
    </radialGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3d42"/><stop offset="4%" stop-color="#8a8e96"/><stop offset="9%" stop-color="#5a5e65"/>
      <stop offset="50%" stop-color="#2c2f34"/><stop offset="91%" stop-color="#494d54"/><stop offset="96%" stop-color="#7b7f87"/>
      <stop offset="100%" stop-color="#33363b"/>
    </linearGradient>
    <!-- Screen is OFF: it reads as a dark mirror picking up the studio -->
    <linearGradient id="offGlass" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#20242c"/><stop offset="30%" stop-color="#12151b"/>
      <stop offset="62%" stop-color="#0a0c11"/><stop offset="100%" stop-color="#161a21"/>
    </linearGradient>
    <linearGradient id="softbox" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="contactBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="screenClip"><rect x="112" y="72" width="176" height="456" rx="28"/></clipPath>
  </defs>

  <rect width="400" height="600" fill="url(#backdrop)"/>
  <ellipse cx="200" cy="546" rx="128" ry="26" fill="#2b2d33" opacity="0.16" filter="url(#ambientBlur)"/>
  <ellipse cx="200" cy="540" rx="86" ry="12" fill="#1c1e24" opacity="0.34" filter="url(#contactBlur)"/>

  <rect x="104" y="64" width="192" height="472" rx="36" fill="url(#frame)"/>
  <rect x="109" y="69" width="182" height="462" rx="32" fill="#0b0c0f"/>

  <g clip-path="url(#screenClip)">
    <rect x="112" y="72" width="176" height="456" fill="url(#offGlass)"/>
    <!-- softbox reflection sweeping the dark panel -->
    <rect x="112" y="72" width="176" height="456" fill="url(#softbox)"/>
    <!-- faint horizon where the backdrop curve reflects: feathered, no hard edge -->
    <rect x="112" y="300" width="176" height="130" fill="url(#horizon)"/>
  </g>

  <rect x="169" y="86" width="62" height="21" rx="10.5" fill="#000000"/>
  <circle cx="220" cy="96.5" r="5.6" fill="#0a0d14"/>
  <circle cx="220" cy="96.5" r="3.6" fill="#161b26"/>
  <circle cx="218.6" cy="95" r="1.4" fill="#59677f" opacity="0.6"/>

  <path d="M 118 96 Q 118 76 140 74 L 200 74" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M 282 470 Q 282 522 254 526 L 210 526" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <rect x="104" y="64" width="192" height="26" rx="36" fill="#ffffff" opacity="0.055"/>
  <rect x="104" y="508" width="192" height="28" rx="36" fill="#000000" opacity="0.22"/>

  <g>
    <rect x="101.6" y="182" width="2.8" height="24" rx="1.4" fill="#6c7179"/>
    <rect x="101.6" y="182" width="1.1" height="24" rx="0.55" fill="#a4aab3"/>
    <rect x="101.6" y="212" width="2.8" height="24" rx="1.4" fill="#6c7179"/>
    <rect x="101.6" y="212" width="1.1" height="24" rx="0.55" fill="#a4aab3"/>
    <rect x="295.6" y="196" width="2.8" height="42" rx="1.4" fill="#3c4046"/>
    <rect x="297.3" y="196" width="1.1" height="42" rx="0.55" fill="#747982"/>
  </g>

  <rect x="186" y="529" width="28" height="2.4" rx="1.2" fill="#000000" opacity="0.55"/>
</svg>
