<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#f7f7f8"/><stop offset="60%" stop-color="#ececed"/><stop offset="100%" stop-color="#d8d9dc"/>
    </radialGradient>
    <!-- Textured magnesium body, light upper-left -->
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#4a4e55"/><stop offset="30%" stop-color="#33373d"/>
      <stop offset="72%" stop-color="#24272c"/><stop offset="100%" stop-color="#2e3238"/>
    </linearGradient>
    <linearGradient id="grip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c4046"/><stop offset="55%" stop-color="#282c31"/><stop offset="100%" stop-color="#1d2024"/>
    </linearGradient>
    <!-- Lens barrel: cylinder, so a vertical band gradient -->
    <linearGradient id="barrel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b1e22"/><stop offset="16%" stop-color="#4a4f56"/>
      <stop offset="42%" stop-color="#2c3036"/><stop offset="76%" stop-color="#191c20"/><stop offset="100%" stop-color="#2a2e34"/>
    </linearGradient>
    <!-- Front element: coated glass, teal/violet flare -->
    <radialGradient id="glass" cx="36%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#2b5f6b"/><stop offset="26%" stop-color="#14313f"/>
      <stop offset="58%" stop-color="#0a1420"/><stop offset="84%" stop-color="#1a1030"/><stop offset="100%" stop-color="#070a10"/>
    </radialGradient>
    <filter id="contactBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="560" height="440" fill="url(#backdrop)"/>
  <ellipse cx="280" cy="392" rx="196" ry="24" fill="#2b2d33" opacity="0.16" filter="url(#ambientBlur)"/>
  <ellipse cx="280" cy="384" rx="140" ry="11" fill="#1c1e24" opacity="0.34" filter="url(#contactBlur)"/>

  <!-- ===== Body ===== -->
  <!-- pentaprism hump -->
  <path d="M 232 108 L 248 74 L 312 74 L 328 108 Z" fill="url(#body)"/>
  <!-- hot shoe -->
  <rect x="262" y="66" width="36" height="9" rx="2" fill="#3d4249"/>
  <rect x="266" y="68" width="28" height="3" rx="1.5" fill="#191c20"/>
  <rect x="262" y="66" width="36" height="2" rx="1" fill="#767c85" opacity="0.65"/>

  <!-- main body slab -->
  <rect x="128" y="108" width="304" height="184" rx="20" fill="url(#body)"/>
  <!-- right-hand grip, bulging out -->
  <path d="M 128 128 Q 96 150 98 208 Q 100 262 132 286 L 168 286 L 168 118 Z" fill="url(#grip)"/>
  <!-- grip rubber texture -->
  <g fill="#15181c" opacity="0.55">
    <rect x="108" y="164" width="44" height="3" rx="1.5"/><rect x="106" y="174" width="48" height="3" rx="1.5"/>
    <rect x="105" y="184" width="50" height="3" rx="1.5"/><rect x="105" y="194" width="50" height="3" rx="1.5"/>
    <rect x="105" y="204" width="50" height="3" rx="1.5"/><rect x="106" y="214" width="49" height="3" rx="1.5"/>
    <rect x="108" y="224" width="47" height="3" rx="1.5"/><rect x="111" y="234" width="44" height="3" rx="1.5"/>
  </g>

  <!-- top plate highlight so the body doesn't read flat -->
  <rect x="128" y="108" width="304" height="14" rx="12" fill="#ffffff" opacity="0.09"/>
  <rect x="128" y="274" width="304" height="18" rx="18" fill="#000000" opacity="0.28"/>

  <!-- mode dial, left shoulder -->
  <ellipse cx="372" cy="98" rx="30" ry="11" fill="#3a3f46"/>
  <ellipse cx="372" cy="95" rx="30" ry="11" fill="#4c525a"/>
  <ellipse cx="372" cy="95" rx="21" ry="7" fill="#2b2f35"/>
  <g stroke="#9aa0a8" stroke-width="1.2" opacity="0.7">
    <line x1="352" y1="95" x2="356" y2="95"/><line x1="388" y1="95" x2="392" y2="95"/>
    <line x1="366" y1="89" x2="368" y2="90.5"/><line x1="378" y1="89" x2="376" y2="90.5"/>
  </g>

  <!-- shutter button on the grip shoulder -->
  <ellipse cx="146" cy="112" rx="15" ry="6" fill="#4e545c"/>
  <ellipse cx="146" cy="110" rx="15" ry="6" fill="#666d76"/>
  <ellipse cx="146" cy="109" rx="9" ry="3.4" fill="#8f959e"/>

  <!-- ===== Lens ===== -->
  <!-- mount ring -->
  <circle cx="280" cy="206" r="94" fill="#1a1d21"/>
  <circle cx="280" cy="206" r="94" fill="none" stroke="#5a6069" stroke-width="1.4" opacity="0.5"/>
  <!-- barrel -->
  <circle cx="280" cy="206" r="88" fill="url(#barrel)"/>
  <!-- focus ring, knurled -->
  <circle cx="280" cy="206" r="76" fill="none" stroke="#22262b" stroke-width="16"/>
  <g stroke="#4a5057" stroke-width="1.6" opacity="0.85">
    <line x1="280" y1="122" x2="280" y2="138"/><line x1="222" y1="148" x2="233" y2="159"/>
    <line x1="196" y1="206" x2="212" y2="206"/><line x1="222" y1="264" x2="233" y2="253"/>
    <line x1="280" y1="290" x2="280" y2="274"/><line x1="338" y1="264" x2="327" y2="253"/>
    <line x1="364" y1="206" x2="348" y2="206"/><line x1="338" y1="148" x2="327" y2="159"/>
  </g>
  <!-- inner barrel step -->
  <circle cx="280" cy="206" r="62" fill="#15181c"/>
  <circle cx="280" cy="206" r="62" fill="none" stroke="#565c64" stroke-width="1" opacity="0.45"/>
  <!-- front element -->
  <circle cx="280" cy="206" r="52" fill="url(#glass)"/>
  <!-- aperture blades hinted deep in the glass -->
  <polygon points="280,176 306,191 306,221 280,236 254,221 254,191" fill="#000000" opacity="0.45"/>
  <!-- coating flares -->
  <ellipse cx="258" cy="182" rx="19" ry="12" fill="#7fd4e6" opacity="0.22" transform="rotate(-32 258 182)"/>
  <ellipse cx="303" cy="232" rx="13" ry="8" fill="#c58bff" opacity="0.18" transform="rotate(-32 303 232)"/>
  <circle cx="252" cy="178" r="5" fill="#ffffff" opacity="0.35"/>
  <!-- rim light on the glass edge -->
  <path d="M 232 174 A 52 52 0 0 1 300 158" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- red accent ring, the classic fast-lens tell -->
  <circle cx="280" cy="206" r="86" fill="none" stroke="#b4232b" stroke-width="3" opacity="0.9" stroke-dasharray="1 0"/>

  <!-- lens-release button -->
  <circle cx="382" cy="206" r="7" fill="#3f444b"/>
  <circle cx="382" cy="204.5" r="7" fill="#565c64"/>

  <!-- af-assist lamp -->
  <circle cx="182" cy="150" r="7" fill="#2a2e34"/>
  <circle cx="182" cy="150" r="4.5" fill="#8c2f27" opacity="0.85"/>
  <circle cx="180.4" cy="148.4" r="1.6" fill="#ffffff" opacity="0.4"/>

  <!-- brand plate -->
  <rect x="330" y="150" width="58" height="10" rx="2" fill="#0f1114" opacity="0.5"/>
  <text x="359" y="158.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="8.5" font-weight="700" letter-spacing="2" fill="#9aa0a8" opacity="0.8">PHOTO</text>
</svg>
