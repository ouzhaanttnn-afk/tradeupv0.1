<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .camera-body { fill: #1f2937; stroke: #111827; stroke-width: 1; }
      .camera-lens { fill: #0f172a; stroke: #374151; stroke-width: 2; }
      .camera-accent { fill: #3b82f6; }
    </style>
  </defs>

  <!-- Camera body - trapezoid shape -->
  <polygon points="30,80 50,50 206,50 226,80 226,200 30,200" class="camera-body" />

  <!-- Main lens barrel -->
  <rect x="80" y="45" width="96" height="80" rx="8" class="camera-lens" />

  <!-- Lens front element (circle) -->
  <circle cx="128" cy="85" r="35" class="camera-lens" />
  <circle cx="128" cy="85" r="30" fill="#1a202c" />
  <circle cx="128" cy="85" r="25" fill="#0f172a" />
  <circle cx="128" cy="85" r="20" fill="#1e293b" />

  <!-- Lens reflections for depth -->
  <circle cx="115" cy="75" r="8" fill="white" opacity="0.2" />
  <circle cx="140" cy="95" r="6" fill="white" opacity="0.15" />

  <!-- Flash -->
  <rect x="160" y="55" width="12" height="18" rx="2" fill="#f3f4f6" opacity="0.8" />

  <!-- Hot shoe -->
  <rect x="110" y="42" width="36" height="4" fill="#374151" />

  <!-- Viewfinder -->
  <rect x="80" y="50" width="12" height="12" rx="1" fill="#0f172a" stroke="#374151" stroke-width="1" />

  <!-- Controls and buttons -->
  <circle cx="50" cy="100" r="4" class="camera-accent" opacity="0.7" />
  <circle cx="50" cy="120" r="4" class="camera-accent" opacity="0.7" />
  <circle cx="50" cy="140" r="4" class="camera-accent" opacity="0.7" />

  <!-- D-pad simulation -->
  <line x1="45" y1="160" x2="55" y2="160" stroke="#3b82f6" stroke-width="2" opacity="0.6" />
  <line x1="50" y1="155" x2="50" y2="165" stroke="#3b82f6" stroke-width="2" opacity="0.6" />

  <!-- Info LCD screen -->
  <rect x="160" y="120" width="50" height="30" rx="2" fill="#1a202c" stroke="#374151" stroke-width="1" />
  <text x="165" y="138" font-size="8" fill="#64748b">ISO</text>

  <!-- Tripod mount simulation -->
  <circle cx="128" cy="195" r="6" fill="#374151" stroke="#2d3748" stroke-width="1" />
</svg>
