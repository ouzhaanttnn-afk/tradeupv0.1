<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .console-body { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .console-screen { fill: #0f172a; stroke: #374151; stroke-width: 1; }
      .console-button { fill: #2d3748; stroke: #1a202c; stroke-width: 1; }
    </style>
  </defs>

  <!-- Main console body -->
  <rect x="30" y="40" width="260" height="140" rx="8" class="console-body" />

  <!-- Screen/display area -->
  <rect x="50" y="55" width="220" height="110" rx="6" class="console-screen" />

  <!-- Screen content simulation -->
  <defs>
    <linearGradient id="console-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="55" y="60" width="210" height="100" fill="url(#console-grad)" />

  <!-- Logo area -->
  <text x="160" y="95" font-size="12" font-weight="bold" fill="#3b82f6" text-anchor="middle" opacity="0.6">GAME</text>

  <!-- Control buttons (left side) - D-pad -->
  <circle cx="85" cy="155" r="3" class="console-button" />
  <circle cx="75" cy="165" r="3" class="console-button" />
  <circle cx="95" cy="165" r="3" class="console-button" />
  <circle cx="85" cy="175" r="3" class="console-button" />

  <!-- Action buttons (right side) -->
  <circle cx="245" cy="150" r="4" fill="#ef4444" opacity="0.7" />
  <circle cx="260" cy="160" r="4" fill="#10b981" opacity="0.7" />
  <circle cx="245" cy="170" r="4" fill="#3b82f6" opacity="0.7" />
  <circle cx="230" cy="160" r="4" fill="#f59e0b" opacity="0.7" />

  <!-- Shoulder buttons -->
  <rect x="65" y="42" width="15" height="8" rx="2" class="console-button" />
  <rect x="240" y="42" width="15" height="8" rx="2" class="console-button" />

  <!-- Vent slits -->
  <line x1="45" y1="175" x2="65" y2="175" stroke="#374151" stroke-width="1" opacity="0.5" />
  <line x1="75" y1="175" x2="95" y2="175" stroke="#374151" stroke-width="1" opacity="0.5" />

  <!-- Power indicator -->
  <circle cx="160" cy="180" r="3" fill="#10b981" opacity="0.8" />
</svg>
