<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#f7f7f8"/><stop offset="60%" stop-color="#ececed"/><stop offset="100%" stop-color="#d8d9dc"/>
    </radialGradient>
    <!-- Anodised aluminium: lighter and less contrasty than titanium, softer falloff -->
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d727a"/><stop offset="5%" stop-color="#b6bbc3"/><stop offset="11%" stop-color="#868b93"/>
      <stop offset="50%" stop-color="#5d626a"/><stop offset="90%" stop-color="#767b83"/><stop offset="96%" stop-color="#a2a7af"/>
      <stop offset="100%" stop-color="#666b73"/>
    </linearGradient>
    <linearGradient id="wallpaper" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#124b52"/><stop offset="45%" stop-color="#0d2f47"/>
      <stop offset="100%" stop-color="#081726"/>
    </linearGradient>
    <radialGradient id="bloom" cx="32%" cy="26%" r="62%">
      <stop offset="0%" stop-color="#2fd0c4" stop-opacity="0.40"/><stop offset="100%" stop-color="#2fd0c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="contactBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="screenClip"><rect x="118" y="80" width="164" height="440" rx="22"/></clipPath>
  </defs>

  <rect width="400" height="600" fill="url(#backdrop)"/>
  <ellipse cx="200" cy="546" rx="126" ry="26" fill="#2b2d33" opacity="0.16" filter="url(#ambientBlur)"/>
  <ellipse cx="200" cy="540" rx="84" ry="12" fill="#1c1e24" opacity="0.34" filter="url(#contactBlur)"/>

  <rect x="106" y="66" width="188" height="468" rx="28" fill="url(#frame)"/>
  <!-- thicker bezel than flagship: a real mid-tier tell -->
  <rect x="112" y="74" width="176" height="452" rx="24" fill="#0d0f13"/>

  <g clip-path="url(#screenClip)">
    <rect x="118" y="80" width="164" height="440" fill="url(#wallpaper)"/>
    <rect x="118" y="80" width="164" height="440" fill="url(#bloom)"/>
    <text x="140" y="108" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" opacity="0.92">9:41</text>
    <g fill="#ffffff" opacity="0.85">
      <rect x="228" y="101" width="2.2" height="4" rx="1"/><rect x="232.5" y="99" width="2.2" height="6" rx="1"/>
      <rect x="237" y="97" width="2.2" height="8" rx="1"/>
      <rect x="245" y="97" width="15" height="8.5" rx="2.4" fill="none" stroke="#ffffff" stroke-width="1.1"/>
      <rect x="246.5" y="98.5" width="9" height="5.5" rx="1.2"/>
    </g>
    <text x="200" y="208" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="54" font-weight="300" fill="#ffffff" opacity="0.95" letter-spacing="-1.5">9:41</text>
    <text x="200" y="232" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#ffffff" opacity="0.68">Thursday, 4 September</text>
    <rect x="170" y="504" width="60" height="4" rx="2" fill="#ffffff" opacity="0.55"/>
    <rect x="118" y="80" width="164" height="440" fill="url(#specular)"/>
  </g>

  <!-- teardrop notch, single camera -->
  <path d="M 186 80 Q 186 98 200 98 Q 214 98 214 80 Z" fill="#000000"/>
  <circle cx="200" cy="88" r="4.6" fill="#0a0d14"/>
  <circle cx="200" cy="88" r="2.9" fill="#151c28"/>
  <circle cx="198.9" cy="86.8" r="1.1" fill="#5a6a86" opacity="0.6"/>

  <path d="M 124 102 Q 124 84 144 82 L 200 82" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <rect x="106" y="66" width="188" height="24" rx="28" fill="#ffffff" opacity="0.07"/>
  <rect x="106" y="508" width="188" height="26" rx="28" fill="#000000" opacity="0.20"/>

  <g>
    <rect x="103.6" y="184" width="2.8" height="22" rx="1.4" fill="#8c9199"/>
    <rect x="103.6" y="184" width="1.1" height="22" rx="0.55" fill="#c3c8d0"/>
    <rect x="103.6" y="212" width="2.8" height="22" rx="1.4" fill="#8c9199"/>
    <rect x="103.6" y="212" width="1.1" height="22" rx="0.55" fill="#c3c8d0"/>
    <rect x="293.6" y="198" width="2.8" height="38" rx="1.4" fill="#5b6068"/>
    <rect x="295.3" y="198" width="1.1" height="38" rx="0.55" fill="#969ba3"/>
  </g>

  <rect x="186" y="527" width="28" height="2.4" rx="1.2" fill="#000000" opacity="0.5"/>
</svg>
