<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#f7f7f8"/><stop offset="60%" stop-color="#ececed"/><stop offset="100%" stop-color="#d8d9dc"/>
    </radialGradient>
    <!-- Matte shell, light upper-left -->
    <linearGradient id="shellL" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#5a606a"/><stop offset="45%" stop-color="#3b4048"/><stop offset="100%" stop-color="#23272d"/>
    </linearGradient>
    <linearGradient id="shellR" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#3e434b"/><stop offset="55%" stop-color="#2a2e35"/><stop offset="100%" stop-color="#191c21"/>
    </linearGradient>
    <!-- Protein-leather pad: soft, absorbs light -->
    <radialGradient id="padL" cx="34%" cy="30%" r="76%">
      <stop offset="0%" stop-color="#3a3f47"/><stop offset="60%" stop-color="#22262c"/><stop offset="100%" stop-color="#14171b"/>
    </radialGradient>
    <linearGradient id="band" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c626c"/><stop offset="55%" stop-color="#3a3f47"/><stop offset="100%" stop-color="#262a30"/>
    </linearGradient>
    <linearGradient id="slider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6f757e"/><stop offset="40%" stop-color="#9ca2ab"/><stop offset="100%" stop-color="#5c626b"/>
    </linearGradient>
    <filter id="contactBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="520" height="480" fill="url(#backdrop)"/>
  <ellipse cx="260" cy="428" rx="176" ry="24" fill="#2b2d33" opacity="0.15" filter="url(#ambientBlur)"/>
  <ellipse cx="260" cy="420" rx="128" ry="11" fill="#1c1e24" opacity="0.32" filter="url(#contactBlur)"/>

  <!-- ===== Headband ===== -->
  <path d="M 116 300 Q 112 108 260 100 Q 408 108 404 300"
        fill="none" stroke="url(#band)" stroke-width="26" stroke-linecap="round"/>
  <!-- padded underside of the band -->
  <path d="M 150 190 Q 260 132 370 190"
        fill="none" stroke="#1b1e23" stroke-width="13" stroke-linecap="round" opacity="0.9"/>
  <!-- band top highlight, following the key light -->
  <path d="M 126 268 Q 124 122 258 112" fill="none" stroke="#aab0ba" stroke-width="2.4" opacity="0.5" stroke-linecap="round"/>
  <path d="M 262 112 Q 396 122 394 268" fill="none" stroke="#8b919b" stroke-width="1.8" opacity="0.28" stroke-linecap="round"/>

  <!-- ===== Extension sliders ===== -->
  <rect x="108" y="248" width="16" height="62" rx="8" fill="url(#slider)"/>
  <rect x="396" y="248" width="16" height="62" rx="8" fill="url(#slider)" opacity="0.85"/>
  <rect x="110" y="250" width="4" height="58" rx="2" fill="#ffffff" opacity="0.35"/>

  <!-- ===== Left cup (near, lit) ===== -->
  <g>
    <!-- yoke -->
    <path d="M 116 300 L 116 318" stroke="#3a3f47" stroke-width="10" stroke-linecap="round"/>
    <!-- outer shell -->
    <ellipse cx="116" cy="352" rx="62" ry="70" fill="url(#shellL)"/>
    <!-- shell rim catching light -->
    <ellipse cx="116" cy="352" rx="62" ry="70" fill="none" stroke="#9aa1ab" stroke-width="1.6" opacity="0.35"/>
    <path d="M 74 310 A 62 70 0 0 1 132 284" stroke="#c3c9d2" stroke-width="2.4" fill="none" opacity="0.45" stroke-linecap="round"/>
    <!-- brushed disc inset -->
    <ellipse cx="116" cy="352" rx="44" ry="50" fill="#2c3037"/>
    <ellipse cx="116" cy="352" rx="44" ry="50" fill="none" stroke="#565c65" stroke-width="1" opacity="0.5"/>
    <!-- concentric machining -->
    <g fill="none" stroke="#3f444c" stroke-width="0.9" opacity="0.7">
      <ellipse cx="116" cy="352" rx="36" ry="41"/><ellipse cx="116" cy="352" rx="28" ry="32"/>
      <ellipse cx="116" cy="352" rx="20" ry="23"/><ellipse cx="116" cy="352" rx="12" ry="14"/>
    </g>
    <!-- ear pad, offset toward the viewer -->
    <ellipse cx="150" cy="356" rx="30" ry="56" fill="url(#padL)" opacity="0.96"/>
    <ellipse cx="152" cy="356" rx="18" ry="42" fill="#0c0e11"/>
    <!-- pad seam -->
    <ellipse cx="150" cy="356" rx="30" ry="56" fill="none" stroke="#4a505a" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- ===== Right cup (far, in shadow) ===== -->
  <g>
    <path d="M 404 300 L 404 318" stroke="#2c3037" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="404" cy="352" rx="58" ry="66" fill="url(#shellR)"/>
    <ellipse cx="404" cy="352" rx="58" ry="66" fill="none" stroke="#6e747e" stroke-width="1.3" opacity="0.28"/>
    <ellipse cx="404" cy="352" rx="41" ry="47" fill="#22262c"/>
    <g fill="none" stroke="#343940" stroke-width="0.9" opacity="0.7">
      <ellipse cx="404" cy="352" rx="33" ry="38"/><ellipse cx="404" cy="352" rx="25" ry="29"/>
      <ellipse cx="404" cy="352" rx="17" ry="20"/>
    </g>
    <!-- rim light on the far edge -->
    <path d="M 452 322 A 58 66 0 0 1 448 386" stroke="#aab0ba" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- controls on the left cup edge -->
  <circle cx="96" cy="416" r="4.4" fill="#4b515a"/>
  <circle cx="96" cy="414.8" r="4.4" fill="#636a74"/>
  <rect x="110" y="410" width="16" height="4.6" rx="2.3" fill="#4b515a"/>
  <!-- usb-c port -->
  <rect x="134" y="410" width="13" height="4.6" rx="2.3" fill="#14171b"/>
  <!-- status LED -->
  <circle cx="84" cy="398" r="2.4" fill="#39d98a" opacity="0.85"/>
</svg>
