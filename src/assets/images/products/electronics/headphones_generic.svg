<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .headphone-band { fill: #1f2937; stroke: #111827; stroke-width: 1.5; }
      .headphone-cup { fill: #2d3748; stroke: #1a202c; stroke-width: 1; }
      .headphone-accent { fill: #3b82f6; }
    </style>
  </defs>

  <!-- Headband -->
  <path d="M 50 160 Q 50 80 80 60 L 176 60 Q 206 80 206 160" class="headphone-band" fill="none" stroke-width="8" />

  <!-- Padding on headband -->
  <path d="M 50 160 Q 50 85 80 65 L 176 65 Q 205 82 205 158" class="headphone-band" fill="none" stroke="#374151" stroke-width="4" opacity="0.5" />

  <!-- Left ear cup -->
  <circle cx="70" cy="140" r="25" class="headphone-cup" />
  <circle cx="70" cy="140" r="20" fill="#1f2937" />
  <circle cx="70" cy="140" r="15" class="headphone-accent" opacity="0.6" />

  <!-- Right ear cup -->
  <circle cx="186" cy="140" r="25" class="headphone-cup" />
  <circle cx="186" cy="140" r="20" fill="#1f2937" />
  <circle cx="186" cy="140" r="15" class="headphone-accent" opacity="0.6" />

  <!-- Ear cup grille -->
  <circle cx="70" cy="140" r="12" fill="none" stroke="#0f172a" stroke-width="0.5" opacity="0.7" />
  <circle cx="186" cy="140" r="12" fill="none" stroke="#0f172a" stroke-width="0.5" opacity="0.7" />

  <!-- Ear pad simulation -->
  <ellipse cx="70" cy="155" rx="18" ry="8" fill="#374151" opacity="0.4" />
  <ellipse cx="186" cy="155" rx="18" ry="8" fill="#374151" opacity="0.4" />

  <!-- Cable connector -->
  <line x1="128" y1="155" x2="128" y2="180" stroke="#374151" stroke-width="3" />
  <circle cx="128" cy="185" r="4" fill="#2d3748" stroke="#111827" stroke-width="1" />

  <!-- Detail lines for 3D effect -->
  <path d="M 50 160 Q 60 100 80 70" stroke="#3b82f6" stroke-width="1" opacity="0.3" fill="none" />
  <path d="M 206 160 Q 196 100 176 70" stroke="#3b82f6" stroke-width="1" opacity="0.3" fill="none" />
</svg>
