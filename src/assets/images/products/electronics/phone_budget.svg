<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#f7f7f8"/><stop offset="60%" stop-color="#ececed"/><stop offset="100%" stop-color="#d8d9dc"/>
    </radialGradient>
    <!-- Matte polycarbonate: almost no specular, flat mid-tone, dull edges -->
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a4d53"/><stop offset="8%" stop-color="#63676e"/>
      <stop offset="50%" stop-color="#55595f"/><stop offset="92%" stop-color="#5e626a"/><stop offset="100%" stop-color="#474a50"/>
    </linearGradient>
    <linearGradient id="wallpaper" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2b3550"/><stop offset="55%" stop-color="#1d2438"/><stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="specular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="contactBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="screenClip"><rect x="124" y="92" width="152" height="404" rx="14"/></clipPath>
  </defs>

  <rect width="400" height="600" fill="url(#backdrop)"/>
  <ellipse cx="200" cy="546" rx="124" ry="26" fill="#2b2d33" opacity="0.15" filter="url(#ambientBlur)"/>
  <ellipse cx="200" cy="540" rx="82" ry="12" fill="#1c1e24" opacity="0.32" filter="url(#contactBlur)"/>

  <rect x="108" y="68" width="184" height="464" rx="20" fill="url(#frame)"/>
  <!-- thick bezels top and bottom, including a visible chin -->
  <rect x="116" y="80" width="168" height="428" rx="16" fill="#101319"/>

  <g clip-path="url(#screenClip)">
    <rect x="124" y="92" width="152" height="404" fill="url(#wallpaper)"/>
    <text x="142" y="118" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="600" fill="#ffffff" opacity="0.85">9:41</text>
    <g fill="#ffffff" opacity="0.78">
      <rect x="222" y="112" width="2" height="4" rx="1"/><rect x="226" y="110" width="2" height="6" rx="1"/>
      <rect x="234" y="109" width="14" height="8" rx="2.2" fill="none" stroke="#ffffff" stroke-width="1"/>
      <rect x="235.4" y="110.4" width="7" height="5.2" rx="1.1"/>
    </g>
    <text x="200" y="218" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="46" font-weight="400" fill="#ffffff" opacity="0.9" letter-spacing="-1">9:41</text>
    <text x="200" y="240" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="500" fill="#ffffff" opacity="0.6">Thursday, 4 September</text>
    <rect x="124" y="92" width="152" height="404" fill="url(#specular)"/>
  </g>

  <!-- wide waterdrop notch, single low-end camera -->
  <path d="M 182 92 Q 182 112 200 112 Q 218 112 218 92 Z" fill="#000000"/>
  <circle cx="200" cy="101" r="4.2" fill="#0b0e15"/>
  <circle cx="200" cy="101" r="2.6" fill="#141a24"/>

  <!-- chin: on-screen nav bar area, a budget tell -->
  <rect x="170" y="500" width="60" height="3.4" rx="1.7" fill="#ffffff" opacity="0.35"/>

  <path d="M 130 114 Q 130 96 148 94 L 200 94" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <rect x="108" y="68" width="184" height="22" rx="20" fill="#ffffff" opacity="0.045"/>
  <rect x="108" y="510" width="184" height="22" rx="20" fill="#000000" opacity="0.18"/>

  <g>
    <rect x="105.8" y="188" width="2.6" height="20" rx="1.3" fill="#6a6e75"/>
    <rect x="105.8" y="214" width="2.6" height="20" rx="1.3" fill="#6a6e75"/>
    <rect x="291.6" y="200" width="2.6" height="34" rx="1.3" fill="#5a5e65"/>
  </g>

  <rect x="188" y="525" width="24" height="2.2" rx="1.1" fill="#000000" opacity="0.45"/>
</svg>
