<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .motorcycle-body { fill: #1f2937; stroke: #111827; stroke-width: 1; }
      .motorcycle-wheel { fill: none; stroke: #2d3748; stroke-width: 2; }
      .motorcycle-tire { fill: #0f0f0f; stroke: #000; stroke-width: 1; }
    </style>
  </defs>

  <!-- Rear wheel -->
  <circle cx="80" cy="140" r="35" class="motorcycle-wheel" />
  <circle cx="80" cy="140" r="30" class="motorcycle-tire" />

  <!-- Front wheel -->
  <circle cx="260" cy="140" r="35" class="motorcycle-wheel" />
  <circle cx="260" cy="140" r="30" class="motorcycle-tire" />

  <!-- Rear axle -->
  <line x1="50" y1="140" x2="110" y2="140" stroke="#2d3748" stroke-width="2" />

  <!-- Swingarm -->
  <path d="M 110 140 L 200 120" stroke="#1f2937" stroke-width="3" />

  <!-- Rear shock -->
  <line x1="120" y1="140" x2="210" y2="70" stroke="#374151" stroke-width="2" />

  <!-- Main frame -->
  <path d="M 110 140 L 140 100 L 160 80 L 200 70" stroke="#1f2937" stroke-width="3" fill="none" />

  <!-- Front forks -->
  <line x1="220" y1="90" x2="250" y2="140" stroke="#2d3748" stroke-width="2" />
  <line x1="240" y1="90" x2="270" y2="140" stroke="#2d3748" stroke-width="2" />

  <!-- Handlebar -->
  <line x1="220" y1="85" x2="200" y2="75" stroke="#1f2937" stroke-width="2" />
  <line x1="220" y1="85" x2="240" y2="75" stroke="#1f2937" stroke-width="2" />

  <!-- Tank -->
  <path d="M 140 100 L 160 80 L 190 85 L 175 110 Z" class="motorcycle-body" />

  <!-- Seat -->
  <ellipse cx="180" cy="95" rx="25" ry="12" class="motorcycle-body" />

  <!-- Engine block -->
  <rect x="150" y="110" width="40" height="30" rx="2" class="motorcycle-body" />

  <!-- Headlight -->
  <circle cx="255" cy="105" r="8" fill="#f59e0b" opacity="0.7" stroke="#1f2937" stroke-width="1" />

  <!-- Taillight -->
  <circle cx="70" cy="115" r="6" fill="#ef4444" opacity="0.6" stroke="#1f2937" stroke-width="1" />

  <!-- Exhaust pipe -->
  <path d="M 180 130 Q 190 140 185 155" stroke="#374151" stroke-width="2.5" />

  <!-- Kickstand -->
  <line x1="160" y1="140" x2="150" y2="160" stroke="#2d3748" stroke-width="1.5" />
</svg>
