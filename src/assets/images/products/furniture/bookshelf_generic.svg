<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="34%" r="76%">
      <stop offset="0%" stop-color="#f7f7f8"/><stop offset="60%" stop-color="#ececed"/><stop offset="100%" stop-color="#d8d9dc"/>
    </radialGradient>
    <linearGradient id="carcass" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#c19359"/><stop offset="40%" stop-color="#a87e46"/><stop offset="100%" stop-color="#82602f"/>
    </linearGradient>
    <linearGradient id="shelfTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d5a96f"/><stop offset="55%" stop-color="#bb8d52"/><stop offset="100%" stop-color="#976f3c"/>
    </linearGradient>
    <linearGradient id="interior" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d5128"/><stop offset="40%" stop-color="#7d5d30"/><stop offset="100%" stop-color="#5c441f"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="440" height="560" fill="url(#backdrop)"/>
  <ellipse cx="220" cy="512" rx="164" ry="24" fill="#2b2d33" opacity="0.14" filter="url(#ambientBlur)"/>

  <!-- ===== Carcass ===== -->
  <rect x="60" y="46" width="320" height="460" fill="url(#interior)"/>
  <!-- side panels, the left one catching the key light -->
  <rect x="60" y="46" width="20" height="460" fill="url(#carcass)"/>
  <rect x="360" y="46" width="20" height="460" fill="#8a6534"/>
  <rect x="60" y="46" width="4" height="460" fill="#dcb27a" opacity="0.7"/>
  <!-- top and bottom rails -->
  <rect x="60" y="46" width="320" height="18" fill="url(#shelfTop)"/>
  <rect x="60" y="488" width="320" height="18" fill="#8a6534"/>

  <!-- ===== Shelves: each gets a lit top edge and a shadow underneath ===== -->
  <g>
    <rect x="80" y="150" width="280" height="12" fill="url(#shelfTop)"/>
    <rect x="80" y="150" width="280" height="3" fill="#e5bd85" opacity="0.75"/>
    <rect x="80" y="162" width="280" height="9" fill="#000000" opacity="0.26" filter="url(#softShadow)"/>

    <rect x="80" y="256" width="280" height="12" fill="url(#shelfTop)"/>
    <rect x="80" y="256" width="280" height="3" fill="#e5bd85" opacity="0.7"/>
    <rect x="80" y="268" width="280" height="9" fill="#000000" opacity="0.26" filter="url(#softShadow)"/>

    <rect x="80" y="362" width="280" height="12" fill="url(#shelfTop)"/>
    <rect x="80" y="362" width="280" height="3" fill="#e5bd85" opacity="0.65"/>
    <rect x="80" y="374" width="280" height="9" fill="#000000" opacity="0.26" filter="url(#softShadow)"/>

    <rect x="80" y="468" width="280" height="12" fill="url(#shelfTop)"/>
    <rect x="80" y="468" width="280" height="3" fill="#e5bd85" opacity="0.6"/>
  </g>

  <!-- ===== Books: varied heights, widths and lean ===== -->
  <!-- shelf 1 -->
  <g>
    <rect x="90"  y="82" width="17" height="68" fill="#7a2c34"/><rect x="90" y="82" width="17" height="4" fill="#a1454e"/>
    <rect x="109" y="74" width="13" height="76" fill="#2f4a6b"/><rect x="109" y="74" width="13" height="4" fill="#4a6c93"/>
    <rect x="124" y="88" width="20" height="62" fill="#3d6b4a"/><rect x="124" y="88" width="20" height="4" fill="#5b8f68"/>
    <rect x="146" y="78" width="11" height="72" fill="#8a5a22"/>
    <rect x="159" y="84" width="16" height="66" fill="#4a3560"/><rect x="159" y="84" width="16" height="4" fill="#6b4f88"/>
    <rect x="177" y="76" width="14" height="74" fill="#a4642a"/>
    <!-- a leaning book with a gap after it -->
    <g transform="rotate(9 195 150)"><rect x="193" y="86" width="15" height="64" fill="#2f4a6b"/></g>
    <rect x="228" y="80" width="18" height="70" fill="#6b2f52"/><rect x="228" y="80" width="18" height="4" fill="#8f4a74"/>
    <rect x="248" y="90" width="12" height="60" fill="#3d6b4a"/>
    <rect x="262" y="76" width="19" height="74" fill="#254156"/><rect x="262" y="76" width="19" height="4" fill="#3f6382"/>
    <rect x="283" y="84" width="14" height="66" fill="#8a5a22"/>
    <rect x="299" y="80" width="16" height="70" fill="#5a2b30"/>
    <rect x="317" y="88" width="13" height="62" fill="#41566e"/>
  </g>

  <!-- shelf 2: books plus a stack lying flat -->
  <g>
    <rect x="90"  y="196" width="15" height="60" fill="#3d6b4a"/><rect x="90" y="196" width="15" height="4" fill="#5b8f68"/>
    <rect x="107" y="188" width="18" height="68" fill="#7a2c34"/>
    <rect x="127" y="200" width="12" height="56" fill="#2f4a6b"/>
    <rect x="141" y="192" width="17" height="64" fill="#8a5a22"/><rect x="141" y="192" width="17" height="4" fill="#b07c3c"/>
    <rect x="160" y="198" width="14" height="58" fill="#4a3560"/>
    <!-- flat stack -->
    <rect x="196" y="238" width="86" height="9" fill="#6b2f52"/>
    <rect x="200" y="229" width="80" height="9" fill="#254156"/>
    <rect x="204" y="220" width="74" height="9" fill="#8a5a22"/>
    <rect x="196" y="238" width="86" height="2" fill="#8f4a74" opacity="0.8"/>
    <!-- a small plant for life -->
    <path d="M 316 236 L 336 236 L 333 256 L 319 256 Z" fill="#a15a3a"/>
    <path d="M 326 236 Q 314 220 306 210 Q 320 214 326 228" fill="#4a7c4a"/>
    <path d="M 326 236 Q 338 218 348 210 Q 336 216 328 230" fill="#5c9457"/>
    <path d="M 326 236 Q 326 216 326 204 Q 332 218 328 234" fill="#3f6b40"/>
  </g>

  <!-- shelf 3 -->
  <g>
    <rect x="92"  y="300" width="16" height="62" fill="#254156"/><rect x="92" y="300" width="16" height="4" fill="#3f6382"/>
    <rect x="110" y="308" width="12" height="54" fill="#8a5a22"/>
    <rect x="124" y="296" width="19" height="66" fill="#5a2b30"/><rect x="124" y="296" width="19" height="4" fill="#7d4148"/>
    <rect x="145" y="304" width="14" height="58" fill="#3d6b4a"/>
    <rect x="161" y="298" width="17" height="64" fill="#4a3560"/>
    <g transform="rotate(-8 182 362)"><rect x="180" y="306" width="14" height="56" fill="#7a2c34"/></g>
    <rect x="212" y="302" width="18" height="60" fill="#2f4a6b"/><rect x="212" y="302" width="18" height="4" fill="#4a6c93"/>
    <rect x="232" y="310" width="13" height="52" fill="#a4642a"/>
    <rect x="247" y="298" width="16" height="64" fill="#3d6b4a"/>
    <rect x="265" y="306" width="15" height="56" fill="#6b2f52"/>
    <!-- decorative box -->
    <rect x="300" y="322" width="46" height="40" fill="#7d6a52"/>
    <rect x="300" y="322" width="46" height="4" fill="#a08a6c"/>
    <rect x="316" y="338" width="14" height="4" rx="2" fill="#4a3d2c"/>
  </g>

  <!-- shelf 4 -->
  <g>
    <rect x="92"  y="410" width="18" height="58" fill="#8a5a22"/><rect x="92" y="410" width="18" height="4" fill="#b07c3c"/>
    <rect x="112" y="418" width="13" height="50" fill="#254156"/>
    <rect x="127" y="406" width="16" height="62" fill="#3d6b4a"/>
    <rect x="145" y="414" width="14" height="54" fill="#5a2b30"/>
    <rect x="161" y="408" width="19" height="60" fill="#4a3560"/><rect x="161" y="408" width="19" height="4" fill="#6b4f88"/>
    <rect x="182" y="416" width="12" height="52" fill="#a4642a"/>
    <rect x="196" y="404" width="17" height="64" fill="#2f4a6b"/>
    <rect x="215" y="412" width="15" height="56" fill="#7a2c34"/>
    <rect x="232" y="406" width="18" height="62" fill="#3d6b4a"/><rect x="232" y="406" width="18" height="4" fill="#5b8f68"/>
    <rect x="252" y="414" width="13" height="54" fill="#6b2f52"/>
    <rect x="267" y="408" width="16" height="60" fill="#254156"/>
    <rect x="285" y="418" width="14" height="50" fill="#8a5a22"/>
    <rect x="301" y="410" width="17" height="58" fill="#4a3560"/>
    <rect x="320" y="416" width="12" height="52" fill="#5a2b30"/>
  </g>

  <!-- plinth -->
  <rect x="72" y="506" width="296" height="12" fill="#6d5128"/>
  <ellipse cx="220" cy="520" rx="150" ry="6" fill="#1c1e24" opacity="0.26" filter="url(#softShadow)"/>

  <!-- key light upper-left across the whole unit -->
  <ellipse cx="120" cy="150" rx="140" ry="180" fill="#ffffff" opacity="0.06" filter="url(#ambientBlur)"/>
  <ellipse cx="350" cy="420" rx="130" ry="170" fill="#000000" opacity="0.07" filter="url(#ambientBlur)"/>
</svg>
