<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .sofa-fabric { fill: #4b5563; stroke: #2d3748; stroke-width: 1; }
      .sofa-wood { fill: #78716c; stroke: #57534e; stroke-width: 1; }
      .sofa-leg { fill: #2d3748; }
      .sofa-cushion { fill: #6b7280; stroke: #4b5563; stroke-width: 1; }
    </style>
  </defs>

  <!-- Main sofa frame -->
  <path d="M 30 80 L 50 60 L 350 60 L 370 80 L 370 140 Q 370 160 360 170 L 40 170 Q 30 160 30 140 Z" class="sofa-fabric" />

  <!-- Backrest cushions (3 sections) -->
  <ellipse cx="120" cy="70" rx="50" ry="35" class="sofa-cushion" />
  <ellipse cx="200" cy="55" rx="50" ry="45" class="sofa-cushion" />
  <ellipse cx="280" cy="70" rx="50" ry="35" class="sofa-cushion" />

  <!-- Seat cushions (3 sections) -->
  <ellipse cx="120" cy="130" rx="45" ry="25" fill="#5a6470" />
  <ellipse cx="200" cy="135" rx="45" ry="28" fill="#5a6470" />
  <ellipse cx="280" cy="130" rx="45" ry="25" fill="#5a6470" />

  <!-- Armrests -->
  <path d="M 35 100 L 50 80 L 55 150 Q 50 160 45 165 Z" class="sofa-fabric" />
  <path d="M 365 100 L 350 80 L 345 150 Q 350 160 355 165 Z" class="sofa-fabric" />

  <!-- Wood trim/base -->
  <rect x="30" y="165" width="340" height="8" rx="2" class="sofa-wood" />

  <!-- Legs (4) -->
  <rect x="55" y="173" width="6" height="30" rx="2" class="sofa-leg" />
  <rect x="155" y="173" width="6" height="30" rx="2" class="sofa-leg" />
  <rect x="245" y="173" width="6" height="30" rx="2" class="sofa-leg" />
  <rect x="345" y="173" width="6" height="30" rx="2" class="sofa-leg" />

  <!-- Pillow details -->
  <circle cx="100" cy="115" r="8" fill="#3b82f6" opacity="0.4" />
  <circle cx="200" cy="110" r="10" fill="#3b82f6" opacity="0.4" />
  <circle cx="300" cy="115" r="8" fill="#3b82f6" opacity="0.4" />

  <!-- Shading for depth -->
  <path d="M 35 80 Q 35 100 30 140" stroke="#2d3748" stroke-width="2" fill="none" opacity="0.3" />
  <path d="M 365 80 Q 365 100 370 140" stroke="#2d3748" stroke-width="2" fill="none" opacity="0.3" />
</svg>
