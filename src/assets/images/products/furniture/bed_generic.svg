<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .bed-frame { fill: #78716c; stroke: #57534e; stroke-width: 1; }
      .bed-mattress { fill: #4b5563; stroke: #2d3748; stroke-width: 1; }
      .bed-sheets { fill: #e5e7eb; stroke: #d1d5db; stroke-width: 1; }
      .bed-pillow { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1; }
    </style>
  </defs>

  <!-- Headboard -->
  <rect x="20" y="20" width="360" height="50" rx="4" class="bed-frame" />

  <!-- Decorative headboard panel -->
  <rect x="30" y="30" width="340" height="30" fill="#6b6b6b" opacity="0.6" />
  <line x1="80" y1="30" x2="80" y2="60" stroke="#57534e" stroke-width="1" opacity="0.5" />
  <line x1="130" y1="30" x2="130" y2="60" stroke="#57534e" stroke-width="1" opacity="0.5" />
  <line x1="180" y1="30" x2="180" y2="60" stroke="#57534e" stroke-width="1" opacity="0.5" />
  <line x1="230" y1="30" x2="230" y2="60" stroke="#57534e" stroke-width="1" opacity="0.5" />
  <line x1="280" y1="30" x2="280" y2="60" stroke="#57534e" stroke-width="1" opacity="0.5" />
  <line x1="330" y1="30" x2="330" y2="60" stroke="#57534e" stroke-width="1" opacity="0.5" />

  <!-- Mattress -->
  <rect x="30" y="70" width="340" height="120" rx="2" class="bed-mattress" />

  <!-- Mattress quilting detail -->
  <line x1="30" y1="100" x2="370" y2="100" stroke="#2d3748" stroke-width="0.5" opacity="0.4" />
  <line x1="30" y1="130" x2="370" y2="130" stroke="#2d3748" stroke-width="0.5" opacity="0.4" />
  <line x1="30" y1="160" x2="370" y2="160" stroke="#2d3748" stroke-width="0.5" opacity="0.4" />

  <!-- Sheets/bedding -->
  <path d="M 40 90 L 50 80 L 360 80 L 350 90 L 350 180 L 40 180 Z" class="bed-sheets" />

  <!-- Pillows (2) -->
  <ellipse cx="120" cy="85" rx="45" ry="20" class="bed-pillow" />
  <ellipse cx="280" cy="85" rx="45" ry="20" class="bed-pillow" />

  <!-- Pillow shading -->
  <path d="M 75 80 Q 120 75 165 85" stroke="#d1d5db" stroke-width="1" fill="none" opacity="0.5" />
  <path d="M 235 80 Q 280 75 325 85" stroke="#d1d5db" stroke-width="1" fill="none" opacity="0.5" />

  <!-- Blanket/comforter fold -->
  <path d="M 50 140 Q 100 135 200 140 Q 300 135 350 140 L 340 180 Q 200 185 60 180 Z" fill="#2d3748" opacity="0.3" />

  <!-- Frame side -->
  <rect x="15" y="70" width="15" height="120" class="bed-frame" />
  <rect x="370" y="70" width="15" height="120" class="bed-frame" />

  <!-- Legs (4) -->
  <rect x="40" y="190" width="8" height="40" rx="2" class="bed-frame" />
  <rect x="352" y="190" width="8" height="40" rx="2" class="bed-frame" />
  <rect x="150" y="190" width="8" height="40" rx="2" class="bed-frame" />
  <rect x="242" y="190" width="8" height="40" rx="2" class="bed-frame" />
</svg>
