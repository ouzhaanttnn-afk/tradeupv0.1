<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="34%" r="76%">
      <stop offset="0%" stop-color="#f7f7f8"/><stop offset="60%" stop-color="#ececed"/><stop offset="100%" stop-color="#d8d9dc"/>
    </radialGradient>
    <linearGradient id="headboard" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#5c6b7a"/><stop offset="45%" stop-color="#4a5866"/><stop offset="100%" stop-color="#39434f"/>
    </linearGradient>
    <linearGradient id="duvet" x1="0%" y1="0%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#f1f3f6"/>
      <stop offset="78%" stop-color="#dde1e7"/><stop offset="100%" stop-color="#c3c8d0"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#fdfdfe"/><stop offset="100%" stop-color="#e4e8ed"/>
    </linearGradient>
    <linearGradient id="oak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a9814f"/><stop offset="55%" stop-color="#8a6739"/><stop offset="100%" stop-color="#65491f"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="620" height="420" fill="url(#backdrop)"/>
  <ellipse cx="310" cy="372" rx="256" ry="26" fill="#2b2d33" opacity="0.14" filter="url(#ambientBlur)"/>

  <!-- ===== Upholstered headboard, channel-tufted ===== -->
  <path d="M 118 62 Q 118 44 138 44 L 482 44 Q 502 44 502 62 L 502 176 L 118 176 Z" fill="url(#headboard)"/>
  <g>
    <!-- vertical channels: each a soft tube -->
    <g stroke="#2f3944" stroke-width="2.2" opacity="0.85">
      <line x1="166" y1="48" x2="166" y2="176"/><line x1="214" y1="46" x2="214" y2="176"/>
      <line x1="262" y1="45" x2="262" y2="176"/><line x1="310" y1="45" x2="310" y2="176"/>
      <line x1="358" y1="45" x2="358" y2="176"/><line x1="406" y1="46" x2="406" y2="176"/>
      <line x1="454" y1="48" x2="454" y2="176"/>
    </g>
    <g stroke="#7c8b9a" stroke-width="1.6" opacity="0.45">
      <line x1="142" y1="52" x2="142" y2="172"/><line x1="190" y1="50" x2="190" y2="172"/>
      <line x1="238" y1="49" x2="238" y2="172"/><line x1="286" y1="48" x2="286" y2="172"/>
    </g>
    <!-- top crown catching the key light -->
    <path d="M 120 60 Q 122 46 140 46 L 310 46" fill="none" stroke="#93a2b1" stroke-width="2.6" opacity="0.6"/>
  </g>

  <!-- ===== Mattress ===== -->
  <path d="M 104 176 L 516 176 L 532 226 L 88 226 Z" fill="#eceff3"/>
  <path d="M 88 226 L 532 226 L 532 252 Q 310 264 88 252 Z" fill="#dfe3e9"/>
  <!-- mattress side stitching -->
  <path d="M 92 238 Q 310 250 528 238" fill="none" stroke="#c3c9d2" stroke-width="1.8" opacity="0.9"/>

  <!-- ===== Fitted sheet turned over the top ===== -->
  <path d="M 104 176 L 516 176 L 524 200 L 96 200 Z" fill="url(#sheet)"/>

  <!-- ===== Pillows: two stacked pairs against the headboard ===== -->
  <g>
    <!-- back pair, propped upright, partly behind -->
    <path d="M 150 106 Q 214 92 274 106 Q 284 146 268 166 Q 210 178 156 166 Q 140 146 150 106 Z" fill="#e9edf2"/>
    <path d="M 346 106 Q 410 92 470 106 Q 480 146 464 166 Q 406 178 352 166 Q 336 146 346 106 Z" fill="#e2e6ec"/>
    <path d="M 158 112 Q 214 100 266 112" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    <path d="M 354 112 Q 410 100 462 112" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    <!-- front pair, lying flatter -->
    <path d="M 158 150 Q 216 136 272 150 Q 282 176 266 186 Q 212 196 162 186 Q 148 176 158 150 Z" fill="#f6f8fa"/>
    <path d="M 348 150 Q 406 136 462 150 Q 472 176 456 186 Q 402 196 352 186 Q 338 176 348 150 Z" fill="#eef1f5"/>
    <!-- pillow shadows on the sheet -->
    <ellipse cx="214" cy="190" rx="62" ry="9" fill="#000000" opacity="0.14" filter="url(#softShadow)"/>
    <ellipse cx="404" cy="190" rx="62" ry="9" fill="#000000" opacity="0.16" filter="url(#softShadow)"/>
  </g>

  <!-- ===== Duvet, folded back with a soft roll ===== -->
  <path d="M 96 226 L 524 226 L 536 300 Q 310 318 84 300 Z" fill="url(#duvet)"/>
  <!-- the turn-over roll at the head of the duvet -->
  <path d="M 96 226 Q 310 244 524 226 L 522 250 Q 310 268 98 250 Z" fill="#ffffff"/>
  <path d="M 98 248 Q 310 266 522 248" fill="none" stroke="#cdd3db" stroke-width="2" opacity="0.9"/>
  <!-- drape folds running down the duvet -->
  <g stroke="#c8ced7" stroke-width="2" opacity="0.55" fill="none">
    <path d="M 170 252 Q 166 278 172 302"/>
    <path d="M 252 254 Q 248 280 254 306"/>
    <path d="M 368 254 Q 372 280 366 306"/>
    <path d="M 450 252 Q 456 278 448 302"/>
  </g>
  <!-- the duvet's front hem, hanging over the foot -->
  <path d="M 84 300 Q 310 318 536 300 L 534 330 Q 310 348 86 330 Z" fill="#d5dae1"/>
  <path d="M 86 328 Q 310 346 534 328" fill="none" stroke="#b4bac3" stroke-width="1.8" opacity="0.8"/>

  <!-- ===== Bed frame rail and legs ===== -->
  <path d="M 86 330 Q 310 348 534 330 L 532 348 Q 310 366 88 348 Z" fill="url(#oak)"/>
  <g fill="url(#oak)">
    <path d="M 104 348 L 118 348 L 122 388 L 108 388 Z"/>
    <path d="M 502 348 L 516 348 L 512 388 L 498 388 Z"/>
  </g>
  <path d="M 104 348 L 108 388" stroke="#c79a60" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="113" cy="390" rx="15" ry="4" fill="#1c1e24" opacity="0.3" filter="url(#softShadow)"/>
  <ellipse cx="507" cy="390" rx="15" ry="4" fill="#1c1e24" opacity="0.3" filter="url(#softShadow)"/>

  <!-- key light upper-left, falloff lower-right -->
  <ellipse cx="160" cy="140" rx="160" ry="120" fill="#ffffff" opacity="0.06" filter="url(#ambientBlur)"/>
  <ellipse cx="500" cy="280" rx="160" ry="120" fill="#000000" opacity="0.06" filter="url(#ambientBlur)"/>
</svg>
