<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .desk-surface { fill: #78716c; stroke: #57534e; stroke-width: 1; }
      .desk-legs { fill: #2d3748; }
      .desk-drawer { fill: #6b6b6b; stroke: #57534e; stroke-width: 1; }
    </style>
  </defs>

  <!-- Desk top surface -->
  <rect x="30" y="80" width="260" height="80" rx="4" class="desk-surface" />

  <!-- Desktop detail - wood grain suggestion -->
  <line x1="30" y1="110" x2="290" y2="110" stroke="#6b6b6b" stroke-width="1" opacity="0.3" />
  <line x1="30" y1="140" x2="290" y2="140" stroke="#6b6b6b" stroke-width="1" opacity="0.3" />

  <!-- Keyboard on desk -->
  <rect x="50" y="95" width="90" height="25" rx="2" fill="#1f2937" stroke="#111827" stroke-width="1" />

  <!-- Monitor on desk -->
  <rect x="160" y="50" width="100" height="65" rx="3" fill="#2d3748" stroke="#111827" stroke-width="1" />
  <rect x="170" y="60" width="80" height="45" fill="#0f172a" />

  <!-- Monitor stand -->
  <rect x="200" y="115" width="20" height="12" rx="2" class="desk-legs" />

  <!-- Left pedestal -->
  <rect x="30" y="160" width="50" height="30" rx="2" class="desk-legs" />

  <!-- Drawer on pedestal -->
  <rect x="35" y="175" width="40" height="12" rx="1" class="desk-drawer" />

  <!-- Right pedestal -->
  <rect x="240" y="160" width="50" height="30" rx="2" class="desk-legs" />

  <!-- Drawer on right pedestal -->
  <rect x="245" y="175" width="40" height="12" rx="1" class="desk-drawer" />

  <!-- Legs from pedestals -->
  <rect x="35" y="190" width="8" height="8" class="desk-legs" />
  <rect x="67" y="190" width="8" height="8" class="desk-legs" />
  <rect x="245" y="190" width="8" height="8" class="desk-legs" />
  <rect x="277" y="190" width="8" height="8" class="desk-legs" />

  <!-- Cable management -->
  <path d="M 290 130 Q 295 150 280 160" stroke="#374151" stroke-width="2" fill="none" opacity="0.5" />

  <!-- Mouse on desktop -->
  <ellipse cx="155" cy="105" rx="8" ry="12" fill="#1a202c" />

  <!-- Lamp on desk -->
  <line x1="265" y1="55" x2="265" y2="85" stroke="#2d3748" stroke-width="2" />
  <circle cx="265" cy="50" r="6" fill="#f59e0b" opacity="0.6" />
</svg>
