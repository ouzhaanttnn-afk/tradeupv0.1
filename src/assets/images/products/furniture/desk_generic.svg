<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="34%" r="76%">
      <stop offset="0%" stop-color="#f7f7f8"/><stop offset="60%" stop-color="#ececed"/><stop offset="100%" stop-color="#d8d9dc"/>
    </radialGradient>
    <!-- Oak veneer top, seen at a shallow angle: light sweeps along the grain -->
    <linearGradient id="topSurface" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#c79a63"/><stop offset="35%" stop-color="#b08551"/>
      <stop offset="75%" stop-color="#95703f"/><stop offset="100%" stop-color="#7d5c31"/>
    </linearGradient>
    <linearGradient id="topEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8e6b3b"/><stop offset="100%" stop-color="#664a26"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f444b"/><stop offset="30%" stop-color="#6f757e"/>
      <stop offset="70%" stop-color="#4a5057"/><stop offset="100%" stop-color="#333940"/>
    </linearGradient>
    <linearGradient id="drawer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b48a56"/><stop offset="100%" stop-color="#8a6739"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="600" height="400" fill="url(#backdrop)"/>
  <ellipse cx="300" cy="352" rx="248" ry="24" fill="#2b2d33" opacity="0.14" filter="url(#ambientBlur)"/>

  <!-- ===== Desktop: a shallow parallelogram so it reads as a surface, not a bar ===== -->
  <path d="M 96 168 L 504 168 L 546 206 L 54 206 Z" fill="url(#topSurface)"/>
  <!-- grain running along the length -->
  <g stroke="#8a6636" stroke-width="1" opacity="0.28">
    <path d="M 104 176 L 512 176"/><path d="M 100 184 L 520 184"/>
    <path d="M 96 192 L 528 192"/><path d="M 92 200 L 536 200"/>
  </g>
  <g stroke="#d4ab74" stroke-width="0.8" opacity="0.35">
    <path d="M 102 180 L 516 180"/><path d="M 94 196 L 532 196"/>
  </g>
  <!-- front edge of the top -->
  <path d="M 54 206 L 546 206 L 546 220 Q 300 230 54 220 Z" fill="url(#topEdge)"/>
  <path d="M 54 206 L 546 206" stroke="#dcb47c" stroke-width="1.8" opacity="0.6"/>

  <!-- ===== Pedestal drawers on the right ===== -->
  <g>
    <path d="M 400 220 L 512 220 L 508 330 L 404 330 Z" fill="#93703f"/>
    <path d="M 406 228 L 506 228 L 504 260 L 408 260 Z" fill="url(#drawer)"/>
    <path d="M 407 266 L 505 266 L 503 298 L 409 298 Z" fill="url(#drawer)"/>
    <path d="M 408 304 L 504 304 L 502 326 L 410 326 Z" fill="url(#drawer)"/>
    <!-- drawer top edges catching light -->
    <path d="M 406 228 L 506 228" stroke="#d6ad74" stroke-width="1.6" opacity="0.65"/>
    <path d="M 407 266 L 505 266" stroke="#d6ad74" stroke-width="1.4" opacity="0.5"/>
    <path d="M 408 304 L 504 304" stroke="#d6ad74" stroke-width="1.2" opacity="0.4"/>
    <!-- recessed pulls -->
    <rect x="438" y="240" width="38" height="5" rx="2.5" fill="#4a3a22" opacity="0.8"/>
    <rect x="438" y="278" width="38" height="5" rx="2.5" fill="#4a3a22" opacity="0.8"/>
    <rect x="438" y="313" width="38" height="5" rx="2.5" fill="#4a3a22" opacity="0.8"/>
  </g>

  <!-- ===== Steel legs on the left, an A-frame ===== -->
  <g>
    <path d="M 96 220 L 108 220 L 132 336 L 120 336 Z" fill="url(#steel)"/>
    <path d="M 176 220 L 188 220 L 164 336 L 152 336 Z" fill="url(#steel)"/>
    <!-- cross rail -->
    <rect x="126" y="286" width="36" height="8" rx="2" fill="#4a5057"/>
    <!-- lit inner edges -->
    <path d="M 96 220 L 120 336" stroke="#9aa1aa" stroke-width="1.4" opacity="0.55"/>
    <path d="M 188 220 L 164 336" stroke="#7d848d" stroke-width="1.2" opacity="0.35"/>
  </g>

  <!-- ===== Modesty panel between the legs and the pedestal ===== -->
  <path d="M 196 226 L 396 226 L 396 268 L 196 268 Z" fill="#7d5c31" opacity="0.55"/>

  <!-- contact shadows -->
  <ellipse cx="126" cy="338" rx="16" ry="4" fill="#1c1e24" opacity="0.3" filter="url(#softShadow)"/>
  <ellipse cx="158" cy="338" rx="16" ry="4" fill="#1c1e24" opacity="0.3" filter="url(#softShadow)"/>
  <ellipse cx="456" cy="332" rx="60" ry="7" fill="#1c1e24" opacity="0.28" filter="url(#softShadow)"/>

  <!-- ===== Objects on the desk, for scale ===== -->
  <!-- monitor -->
  <g>
    <rect x="238" y="52" width="180" height="106" rx="5" fill="#2a2e34"/>
    <rect x="244" y="58" width="168" height="92" rx="3" fill="#0f1626"/>
    <rect x="252" y="66" width="88" height="6" rx="3" fill="#4d7fd6" opacity="0.7"/>
    <rect x="252" y="80" width="150" height="4" rx="2" fill="#ffffff" opacity="0.18"/>
    <rect x="252" y="90" width="132" height="4" rx="2" fill="#ffffff" opacity="0.14"/>
    <rect x="252" y="100" width="146" height="4" rx="2" fill="#ffffff" opacity="0.14"/>
    <rect x="252" y="122" width="60" height="16" rx="3" fill="#3b82f6" opacity="0.75"/>
    <!-- stand -->
    <path d="M 316 158 L 340 158 L 346 176 L 310 176 Z" fill="#3a3f46"/>
    <ellipse cx="328" cy="178" rx="34" ry="6" fill="#4a5057"/>
    <!-- screen sheen -->
    <path d="M 244 58 L 300 58 L 250 150 L 244 150 Z" fill="#ffffff" opacity="0.05"/>
  </g>
  <!-- keyboard -->
  <path d="M 214 182 L 330 182 L 340 196 L 218 196 Z" fill="#3a3f46"/>
  <path d="M 214 182 L 330 182" stroke="#767c85" stroke-width="1.4" opacity="0.6"/>
  <!-- mouse -->
  <ellipse cx="364" cy="188" rx="13" ry="8" fill="#3a3f46"/>
  <ellipse cx="362" cy="186" rx="13" ry="8" fill="#4d535b"/>
  <!-- mug -->
  <path d="M 150 172 L 176 172 L 172 196 L 154 196 Z" fill="#e8eaee"/>
  <path d="M 176 178 Q 186 180 184 188 Q 182 194 174 192" fill="none" stroke="#e8eaee" stroke-width="3"/>
  <ellipse cx="163" cy="172" rx="13" ry="4" fill="#c9ced6"/>
  <ellipse cx="163" cy="172" rx="10" ry="3" fill="#5a4433"/>

  <!-- key light upper-left -->
  <ellipse cx="150" cy="150" rx="150" ry="120" fill="#ffffff" opacity="0.05" filter="url(#ambientBlur)"/>
  <ellipse cx="490" cy="280" rx="150" ry="110" fill="#000000" opacity="0.06" filter="url(#ambientBlur)"/>
</svg>
