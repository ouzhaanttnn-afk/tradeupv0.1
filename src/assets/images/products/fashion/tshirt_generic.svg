<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .tshirt-main { fill: #2d3748; stroke: #1a202c; stroke-width: 1; }
      .tshirt-accent { fill: #3b82f6; }
    </style>
  </defs>

  <!-- T-shirt body -->
  <path d="M 40 40 L 70 30 L 100 35 L 100 100 L 120 100 L 120 250 Q 120 260 110 260 L 90 260 Q 80 260 80 250 L 80 160 L 40 160 L 40 250 Q 40 260 30 260 L 10 260 Q 0 260 0 250 L 0 100 L 20 100 L 20 35 L 50 30 Z" class="tshirt-main" />

  <!-- Simplified t-shirt -->
  <!-- Chest -->
  <polygon points="40,60 160,60 160,150 40,150" class="tshirt-main" />

  <!-- Left sleeve -->
  <ellipse cx="20" cy="100" rx="25" ry="35" class="tshirt-main" />

  <!-- Right sleeve -->
  <ellipse cx="180" cy="100" rx="25" ry="35" class="tshirt-main" />

  <!-- Sleeves continuation to body -->
  <path d="M 40 70 Q 20 75 15 100 Q 20 85 45 80" class="tshirt-main" />
  <path d="M 160 70 Q 180 75 185 100 Q 180 85 155 80" class="tshirt-main" />

  <!-- Lower body/torso -->
  <polygon points="50,150 150,150 145,260 55,260" class="tshirt-main" />

  <!-- Neckline -->
  <ellipse cx="100" cy="65" rx="20" ry="15" fill="#0f172a" stroke="#1a202c" stroke-width="1" />

  <!-- Design/graphic on chest -->
  <rect x="75" y="110" width="50" height="25" rx="3" class="tshirt-accent" opacity="0.6" />
  <text x="100" y="128" font-size="10" font-weight="bold" fill="white" text-anchor="middle" opacity="0.8">TRADE</text>

  <!-- Sleeve cuffs -->
  <ellipse cx="20" cy="135" rx="15" ry="8" fill="#1a202c" opacity="0.5" />
  <ellipse cx="180" cy="135" rx="15" ry="8" fill="#1a202c" opacity="0.5" />

  <!-- Waistband -->
  <ellipse cx="100" cy="150" rx="55" ry="8" fill="#1a202c" opacity="0.4" />
</svg>
