<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#f7f7f8"/><stop offset="60%" stop-color="#ececed"/><stop offset="100%" stop-color="#d8d9dc"/>
    </radialGradient>
    <!-- Cotton jersey: matte, wide soft falloff, no specular highlight -->
    <linearGradient id="cotton" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#4d5a74"/><stop offset="38%" stop-color="#3c4860"/>
      <stop offset="75%" stop-color="#313b50"/><stop offset="100%" stop-color="#283040"/>
    </linearGradient>
    <!-- Fold shadows: soft, directional, following the drape -->
    <linearGradient id="foldDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <!-- the garment silhouette, reused for clipping the shading passes -->
    <clipPath id="teeClip">
      <path d="M 168 96 L 132 112 L 92 168 L 128 200 L 150 176 L 150 434 Q 230 446 310 434 L 310 176 L 332 200 L 368 168 L 328 112 L 292 96
               Q 276 122 230 122 Q 184 122 168 96 Z"/>
    </clipPath>
  </defs>

  <rect width="460" height="520" fill="url(#backdrop)"/>
  <ellipse cx="230" cy="452" rx="150" ry="26" fill="#2b2d33" opacity="0.13" filter="url(#ambientBlur)"/>

  <!-- garment body -->
  <path d="M 168 96 L 132 112 L 92 168 L 128 200 L 150 176 L 150 434 Q 230 446 310 434 L 310 176 L 332 200 L 368 168 L 328 112 L 292 96
           Q 276 122 230 122 Q 184 122 168 96 Z" fill="url(#cotton)"/>

  <g clip-path="url(#teeClip)">
    <!-- vertical drape folds -->
    <rect x="168" y="120" width="26" height="330" fill="url(#foldDark)"/>
    <rect x="204" y="120" width="20" height="330" fill="url(#foldLight)"/>
    <rect x="246" y="120" width="24" height="330" fill="url(#foldDark)" opacity="0.8"/>
    <rect x="282" y="120" width="18" height="330" fill="url(#foldLight)" opacity="0.7"/>
    <!-- armhole shadows where the sleeve meets the body -->
    <ellipse cx="150" cy="200" rx="26" ry="60" fill="#000000" opacity="0.16" filter="url(#softShadow)"/>
    <ellipse cx="310" cy="200" rx="26" ry="60" fill="#000000" opacity="0.20" filter="url(#softShadow)"/>
    <!-- hem shadow: fabric curls slightly toward the surface -->
    <ellipse cx="230" cy="440" rx="90" ry="22" fill="#000000" opacity="0.22" filter="url(#softShadow)"/>
    <!-- overall key light from upper-left -->
    <ellipse cx="176" cy="170" rx="90" ry="80" fill="#ffffff" opacity="0.07" filter="url(#softShadow)"/>
    <!-- lower-right falls away -->
    <ellipse cx="318" cy="400" rx="90" ry="80" fill="#000000" opacity="0.10" filter="url(#softShadow)"/>
  </g>

  <!-- ribbed collar -->
  <path d="M 168 96 Q 184 124 230 124 Q 276 124 292 96 Q 276 112 230 112 Q 184 112 168 96 Z" fill="#2a3242"/>
  <path d="M 170 99 Q 186 120 230 120 Q 274 120 290 99" fill="none" stroke="#5f6d88" stroke-width="1.6" opacity="0.55"/>
  <g stroke="#222936" stroke-width="0.8" opacity="0.6">
    <line x1="186" y1="105" x2="188" y2="115"/><line x1="200" y1="110" x2="201" y2="120"/>
    <line x1="230" y1="112" x2="230" y2="122"/><line x1="260" y1="110" x2="259" y2="120"/>
    <line x1="274" y1="105" x2="272" y2="115"/>
  </g>

  <!-- sleeve hems -->
  <path d="M 92 168 L 128 200" stroke="#2a3242" stroke-width="7" stroke-linecap="round"/>
  <path d="M 368 168 L 332 200" stroke="#252c3a" stroke-width="7" stroke-linecap="round"/>

  <!-- bottom hem -->
  <path d="M 150 428 Q 230 440 310 428" fill="none" stroke="#2a3242" stroke-width="5"/>
  <path d="M 150 424 Q 230 436 310 424" fill="none" stroke="#5c6a84" stroke-width="1.2" opacity="0.35"/>

  <!-- screen-printed chest graphic, sitting on the fabric (slightly matte) -->
  <g opacity="0.9">
    <rect x="188" y="212" width="84" height="30" rx="4" fill="#e8ecf4" opacity="0.92"/>
    <text x="230" y="233" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
          font-size="16" font-weight="800" letter-spacing="1.5" fill="#2a3242">TRADE</text>
  </g>
  <!-- the print catches the fold shading too -->
  <rect x="188" y="212" width="84" height="30" rx="4" fill="url(#foldDark)" opacity="0.35"/>

  <!-- outer silhouette edge, very slight lift -->
  <path d="M 168 96 L 132 112 L 92 168" fill="none" stroke="#7c8aa6" stroke-width="1.2" opacity="0.4"/>
</svg>
