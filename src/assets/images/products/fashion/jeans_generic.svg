<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#f7f7f8"/><stop offset="60%" stop-color="#ececed"/><stop offset="100%" stop-color="#d8d9dc"/>
    </radialGradient>
    <!-- Indigo denim: mid-tone body with the classic lighter wear down the thigh -->
    <linearGradient id="denim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20344f"/><stop offset="22%" stop-color="#2c4665"/>
      <stop offset="50%" stop-color="#3a5a7d"/><stop offset="78%" stop-color="#2a4260"/><stop offset="100%" stop-color="#1c2e46"/>
    </linearGradient>
    <!-- whisker / thigh fade -->
    <radialGradient id="fade" cx="50%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#7d9dc0" stop-opacity="0.34"/>
      <stop offset="70%" stop-color="#7d9dc0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7d9dc0" stop-opacity="0"/>
    </radialGradient>
    <!-- twill weave: fine diagonal, the thing that makes denim read as denim -->
    <pattern id="twill" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="6" height="6" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0d1a2b" stroke-width="1.6" opacity="0.18"/>
      <line x1="3" y1="0" x2="3" y2="6" stroke="#8fb0d4" stroke-width="0.8" opacity="0.10"/>
    </pattern>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="jeanClip">
      <path d="M 106 84 L 274 84 L 268 150 L 262 500 L 200 500 L 190 236 L 180 500 L 118 500 L 112 150 Z"/>
    </clipPath>
  </defs>

  <rect width="380" height="560" fill="url(#backdrop)"/>
  <ellipse cx="190" cy="512" rx="120" ry="24" fill="#2b2d33" opacity="0.14" filter="url(#ambientBlur)"/>

  <!-- body -->
  <path d="M 106 84 L 274 84 L 268 150 L 262 500 L 200 500 L 190 236 L 180 500 L 118 500 L 112 150 Z" fill="url(#denim)"/>

  <g clip-path="url(#jeanClip)">
    <rect x="90" y="70" width="200" height="450" fill="url(#twill)"/>
    <ellipse cx="190" cy="210" rx="86" ry="120" fill="url(#fade)"/>
    <!-- whiskers radiating from the crotch, the classic wear pattern -->
    <g stroke="#8fb0d4" stroke-width="3" opacity="0.22" stroke-linecap="round" fill="none">
      <path d="M 150 196 Q 172 202 186 210"/>
      <path d="M 146 214 Q 170 218 186 224"/>
      <path d="M 230 196 Q 208 202 194 210"/>
      <path d="M 234 214 Q 210 218 194 224"/>
    </g>
    <!-- knee fade -->
    <ellipse cx="148" cy="330" rx="30" ry="42" fill="#8fb0d4" opacity="0.10" filter="url(#softShadow)"/>
    <ellipse cx="232" cy="330" rx="30" ry="42" fill="#8fb0d4" opacity="0.08" filter="url(#softShadow)"/>
    <!-- inner-leg shadow -->
    <rect x="180" y="230" width="20" height="280" fill="#000000" opacity="0.28" filter="url(#softShadow)"/>
    <!-- outer edges roll away from the light -->
    <rect x="106" y="84" width="18" height="430" fill="#000000" opacity="0.20" filter="url(#softShadow)"/>
    <rect x="254" y="84" width="20" height="430" fill="#000000" opacity="0.26" filter="url(#softShadow)"/>
    <!-- hem stack shadows -->
    <rect x="118" y="470" width="64" height="34" fill="#000000" opacity="0.20" filter="url(#softShadow)"/>
    <rect x="200" y="470" width="64" height="34" fill="#000000" opacity="0.22" filter="url(#softShadow)"/>
  </g>

  <!-- waistband -->
  <path d="M 106 84 L 274 84 L 272 112 L 108 112 Z" fill="#233852"/>
  <path d="M 106 86 L 274 86" stroke="#6d8db0" stroke-width="1.4" opacity="0.4"/>
  <!-- belt loops -->
  <g fill="#1d3049">
    <rect x="124" y="84" width="9" height="26" rx="2"/><rect x="186" y="84" width="9" height="26" rx="2"/>
    <rect x="248" y="84" width="9" height="26" rx="2"/>
  </g>

  <!-- fly + button -->
  <path d="M 190 112 L 190 176" stroke="#16263a" stroke-width="2" opacity="0.8"/>
  <circle cx="190" cy="100" r="6.5" fill="#9a7b45"/>
  <circle cx="190" cy="99" r="6.5" fill="#c2a163"/>
  <circle cx="190" cy="99" r="3" fill="#8a6f3e"/>

  <!-- topstitching, the golden thread that reads instantly as denim -->
  <g stroke="#d9a441" stroke-width="1.5" fill="none" opacity="0.85" stroke-dasharray="4 3">
    <path d="M 108 112 L 272 112"/>
    <path d="M 196 114 L 196 178 Q 194 190 186 196"/>
    <!-- coin / front pockets -->
    <path d="M 122 116 Q 146 150 132 172"/>
    <path d="M 258 116 Q 234 150 248 172"/>
    <!-- inseam and outseam -->
    <path d="M 186 240 L 178 494"/>
    <path d="M 194 240 L 202 494"/>
  </g>

  <!-- rivets -->
  <circle cx="133" cy="171" r="2.8" fill="#c2a163"/>
  <circle cx="247" cy="171" r="2.8" fill="#c2a163"/>

  <!-- hems -->
  <path d="M 118 494 L 182 494" stroke="#1a2b41" stroke-width="8"/>
  <path d="M 200 494 L 264 494" stroke="#16263a" stroke-width="8"/>
  <g stroke="#d9a441" stroke-width="1.2" opacity="0.7" stroke-dasharray="4 3">
    <path d="M 118 488 L 182 488"/><path d="M 200 488 L 264 488"/>
  </g>

  <!-- leather patch -->
  <rect x="238" y="86" width="30" height="20" rx="3" fill="#6b4a2a"/>
  <rect x="238" y="86" width="30" height="20" rx="3" fill="none" stroke="#8a6238" stroke-width="1"/>
  <text x="253" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#d8b98c">DENIM</text>
</svg>
