<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#f7f7f8"/><stop offset="60%" stop-color="#ececed"/><stop offset="100%" stop-color="#d8d9dc"/>
    </radialGradient>
    <!-- Technical nylon shell: slight sheen, unlike the matte cotton tee -->
    <linearGradient id="shell" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#3f5a4c"/><stop offset="35%" stop-color="#31473d"/>
      <stop offset="72%" stop-color="#26372f"/><stop offset="100%" stop-color="#1d2b25"/>
    </linearGradient>
    <linearGradient id="baffleLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="jClip">
      <path d="M 240 96 L 176 108 L 118 150 L 96 268 L 138 286 L 150 232 L 150 452 Q 240 468 330 452 L 330 232 L 342 286 L 384 268 L 362 150 L 304 108 Z"/>
    </clipPath>
  </defs>

  <rect width="480" height="540" fill="url(#backdrop)"/>
  <ellipse cx="240" cy="474" rx="164" ry="26" fill="#2b2d33" opacity="0.13" filter="url(#ambientBlur)"/>

  <path d="M 240 96 L 176 108 L 118 150 L 96 268 L 138 286 L 150 232 L 150 452 Q 240 468 330 452 L 330 232 L 342 286 L 384 268 L 362 150 L 304 108 Z"
        fill="url(#shell)"/>

  <g clip-path="url(#jClip)">
    <!-- quilted baffles: each one is a soft tube, so light on top, shadow underneath -->
    <g>
      <rect x="90" y="150" width="300" height="34" fill="url(#baffleLight)"/>
      <rect x="90" y="188" width="300" height="34" fill="url(#baffleLight)"/>
      <rect x="90" y="226" width="300" height="34" fill="url(#baffleLight)"/>
      <rect x="90" y="264" width="300" height="34" fill="url(#baffleLight)"/>
      <rect x="90" y="302" width="300" height="34" fill="url(#baffleLight)"/>
      <rect x="90" y="340" width="300" height="34" fill="url(#baffleLight)"/>
      <rect x="90" y="378" width="300" height="34" fill="url(#baffleLight)"/>
      <rect x="90" y="416" width="300" height="34" fill="url(#baffleLight)"/>
    </g>
    <!-- stitch lines between baffles -->
    <g stroke="#16211c" stroke-width="1.4" opacity="0.7">
      <line x1="90" y1="186" x2="390" y2="186"/><line x1="90" y1="224" x2="390" y2="224"/>
      <line x1="90" y1="262" x2="390" y2="262"/><line x1="90" y1="300" x2="390" y2="300"/>
      <line x1="90" y1="338" x2="390" y2="338"/><line x1="90" y1="376" x2="390" y2="376"/>
      <line x1="90" y1="414" x2="390" y2="414"/>
    </g>
    <!-- armhole shading -->
    <ellipse cx="150" cy="250" rx="26" ry="80" fill="#000000" opacity="0.18" filter="url(#softShadow)"/>
    <ellipse cx="330" cy="250" rx="26" ry="80" fill="#000000" opacity="0.24" filter="url(#softShadow)"/>
    <!-- key light upper-left -->
    <ellipse cx="170" cy="190" rx="100" ry="90" fill="#ffffff" opacity="0.07" filter="url(#softShadow)"/>
    <ellipse cx="340" cy="420" rx="100" ry="90" fill="#000000" opacity="0.12" filter="url(#softShadow)"/>
    <!-- centre-front shadow either side of the zip -->
    <rect x="222" y="110" width="16" height="350" fill="#000000" opacity="0.20" filter="url(#softShadow)"/>
  </g>

  <!-- collar, standing -->
  <path d="M 240 96 L 176 108 Q 196 74 240 70 Q 284 74 304 108 Z" fill="#2b3f36"/>
  <path d="M 178 106 Q 198 78 240 74 Q 282 78 302 106" fill="none" stroke="#5e7b6c" stroke-width="1.6" opacity="0.5"/>

  <!-- main zip -->
  <rect x="236" y="100" width="8" height="356" fill="#161f1b"/>
  <g stroke="#8b969a" stroke-width="0.9" opacity="0.7">
    <line x1="237" y1="112" x2="243" y2="112"/><line x1="237" y1="122" x2="243" y2="122"/>
    <line x1="237" y1="132" x2="243" y2="132"/><line x1="237" y1="142" x2="243" y2="142"/>
    <line x1="237" y1="152" x2="243" y2="152"/><line x1="237" y1="162" x2="243" y2="162"/>
    <line x1="237" y1="172" x2="243" y2="172"/><line x1="237" y1="182" x2="243" y2="182"/>
  </g>
  <!-- zip pull -->
  <rect x="234" y="188" width="12" height="9" rx="2" fill="#b7bfc4"/>
  <rect x="238" y="196" width="4" height="16" rx="2" fill="#8f989e"/>

  <!-- chest pocket zip -->
  <rect x="272" y="212" width="52" height="5" rx="2.5" fill="#1a2620"/>
  <rect x="318" y="209" width="8" height="7" rx="2" fill="#b7bfc4"/>

  <!-- hand-pocket welts -->
  <path d="M 168 352 L 214 366" stroke="#1a2620" stroke-width="6" stroke-linecap="round"/>
  <path d="M 312 352 L 266 366" stroke="#1a2620" stroke-width="6" stroke-linecap="round"/>

  <!-- elasticated cuffs -->
  <path d="M 96 268 L 138 286" stroke="#20302a" stroke-width="14" stroke-linecap="round"/>
  <path d="M 384 268 L 342 286" stroke="#1b2924" stroke-width="14" stroke-linecap="round"/>
  <g stroke="#3f5a4c" stroke-width="0.9" opacity="0.6">
    <line x1="100" y1="262" x2="106" y2="278"/><line x1="108" y1="266" x2="114" y2="282"/>
    <line x1="116" y1="270" x2="122" y2="286"/>
    <line x1="380" y1="262" x2="374" y2="278"/><line x1="372" y1="266" x2="366" y2="282"/>
  </g>

  <!-- hem drawcord channel -->
  <path d="M 150 446 Q 240 462 330 446" fill="none" stroke="#20302a" stroke-width="9"/>
  <circle cx="216" cy="458" r="3" fill="#0f1613"/>
  <circle cx="264" cy="458" r="3" fill="#0f1613"/>
</svg>
