<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .jacket-main { fill: #1f2937; stroke: #111827; stroke-width: 1; }
      .jacket-accent { fill: #3b82f6; }
      .jacket-zipper { stroke: #c0c0c0; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Jacket body -->
  <!-- Left side -->
  <path d="M 50 50 L 60 40 L 80 50 L 85 150 L 50 180 Z" class="jacket-main" />

  <!-- Right side -->
  <path d="M 150 50 L 140 40 L 120 50 L 115 150 L 150 180 Z" class="jacket-main" />

  <!-- Center front panel -->
  <polygon points="80,50 120,50 120,180 80,180" class="jacket-main" />

  <!-- Left sleeve -->
  <ellipse cx="40" cy="100" rx="28" ry="45" class="jacket-main" />

  <!-- Right sleeve -->
  <ellipse cx="160" cy="100" rx="28" ry="45" class="jacket-main" />

  <!-- Collar -->
  <path d="M 80 50 Q 100 35 120 50" class="jacket-main" />

  <!-- Chest pocket left -->
  <rect x="65" y="95" width="20" height="25" rx="2" fill="none" stroke="#0f172a" stroke-width="0.5" opacity="0.6" />

  <!-- Chest pocket right -->
  <rect x="115" y="95" width="20" height="25" rx="2" fill="none" stroke="#0f172a" stroke-width="0.5" opacity="0.6" />

  <!-- Main zipper -->
  <line x1="100" y1="50" x2="100" y2="170" class="jacket-zipper" />

  <!-- Zipper pull -->
  <circle cx="100" cy="55" r="2" fill="#c0c0c0" />

  <!-- Cuffs -->
  <ellipse cx="40" cy="145" rx="12" ry="10" fill="#0f172a" opacity="0.5" />
  <ellipse cx="160" cy="145" rx="12" ry="10" fill="#0f172a" opacity="0.5" />

  <!-- Waist detail line -->
  <line x1="50" y1="140" x2="150" y2="140" stroke="#0f172a" stroke-width="1" opacity="0.4" />

  <!-- Accent stripe on sleeve -->
  <ellipse cx="25" cy="100" rx="6" ry="40" fill="#3b82f6" opacity="0.4" />
  <ellipse cx="175" cy="100" rx="6" ry="40" fill="#3b82f6" opacity="0.4" />
</svg>
