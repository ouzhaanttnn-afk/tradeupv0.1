<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="34%" r="76%">
      <stop offset="0%" stop-color="#f7f7f8"/><stop offset="60%" stop-color="#ececed"/><stop offset="100%" stop-color="#d8d9dc"/>
    </radialGradient>
    <!-- Cloth-bound cover, seen at a slight angle -->
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#2f5e6e"/><stop offset="45%" stop-color="#244d5c"/><stop offset="100%" stop-color="#1a3b47"/>
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#173540"/><stop offset="55%" stop-color="#204755"/><stop offset="100%" stop-color="#2b5768"/>
    </linearGradient>
    <!-- Page block: many sheets, so a fine banded gradient -->
    <linearGradient id="pages" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4f1e8"/><stop offset="30%" stop-color="#e6e1d2"/>
      <stop offset="70%" stop-color="#d6cfbc"/><stop offset="100%" stop-color="#c2b9a3"/>
    </linearGradient>
    <linearGradient id="pagesTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#faf8f2"/><stop offset="100%" stop-color="#ded7c6"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="460" height="520" fill="url(#backdrop)"/>
  <ellipse cx="236" cy="452" rx="164" ry="26" fill="#2b2d33" opacity="0.14" filter="url(#ambientBlur)"/>
  <ellipse cx="232" cy="440" rx="126" ry="12" fill="#1c1e24" opacity="0.28" filter="url(#softShadow)"/>

  <!-- ===== Page block, offset behind the cover so the fore-edge shows ===== -->
  <path d="M 152 92 L 336 76 L 344 424 L 160 440 Z" fill="url(#pages)"/>
  <!-- individual leaves along the fore-edge -->
  <g stroke="#bdb49d" stroke-width="0.7" opacity="0.55">
    <path d="M 337 80 L 345 428"/><path d="M 334 82 L 342 430"/><path d="M 331 84 L 339 432"/>
    <path d="M 328 86 L 336 434"/><path d="M 325 88 L 333 436"/>
  </g>
  <!-- top edge of the block -->
  <path d="M 152 92 L 336 76 L 330 68 L 148 84 Z" fill="url(#pagesTop)"/>

  <!-- ===== Front cover, lifted slightly and casting onto the pages ===== -->
  <path d="M 116 96 L 306 78 L 314 428 L 124 446 Z" fill="url(#cover)"/>
  <!-- shadow the cover throws onto the page block -->
  <path d="M 306 78 L 314 428 L 322 427 L 314 77 Z" fill="#000000" opacity="0.18" filter="url(#softShadow)"/>

  <!-- ===== Spine, turned toward the viewer ===== -->
  <path d="M 116 96 L 124 446 L 96 434 L 88 84 Z" fill="url(#spine)"/>
  <!-- raised bands across the spine -->
  <g fill="#122c36" opacity="0.7">
    <path d="M 92 146 L 120 156 L 120 164 L 92 154 Z"/>
    <path d="M 94 250 L 122 260 L 122 268 L 94 258 Z"/>
    <path d="M 96 354 L 124 364 L 124 372 L 96 362 Z"/>
  </g>
  <!-- spine title, running with the spine -->
  <text transform="translate(108,300) rotate(-87)" text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="600"
        letter-spacing="2.5" fill="#d9b86a">THE TRADE</text>

  <!-- ===== Cover artwork ===== -->
  <!-- foil rule border -->
  <path d="M 132 118 L 292 103 L 298 404 L 138 420 Z" fill="none" stroke="#d9b86a" stroke-width="1.6" opacity="0.75"/>
  <!-- title block -->
  <text x="212" y="196" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="30" font-weight="700" fill="#f0e6d2" transform="rotate(-5 212 196)">THE</text>
  <text x="216" y="238" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="34" font-weight="700" fill="#f0e6d2" transform="rotate(-5 216 238)">TRADE</text>
  <!-- rule under the title -->
  <path d="M 158 258 L 274 247" stroke="#d9b86a" stroke-width="2" opacity="0.8"/>
  <!-- a small emblem -->
  <g transform="rotate(-5 216 316)">
    <circle cx="216" cy="316" r="30" fill="none" stroke="#d9b86a" stroke-width="1.8" opacity="0.8"/>
    <path d="M 200 322 L 216 298 L 232 322 Z" fill="none" stroke="#d9b86a" stroke-width="1.6" opacity="0.8"/>
    <circle cx="216" cy="316" r="5" fill="#d9b86a" opacity="0.8"/>
  </g>
  <!-- author -->
  <text x="220" y="392" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="13" letter-spacing="2" fill="#cbbb9a" transform="rotate(-5 220 392)">A. MERCHANT</text>

  <!-- cloth weave hinted across the cover -->
  <g stroke="#0f2c36" stroke-width="0.6" opacity="0.18">
    <path d="M 120 140 L 308 122"/><path d="M 121 180 L 309 162"/><path d="M 122 220 L 310 202"/>
    <path d="M 123 260 L 311 242"/><path d="M 124 300 L 312 282"/><path d="M 125 340 L 313 322"/>
    <path d="M 126 380 L 314 362"/>
  </g>

  <!-- cover sheen: cloth is matte, so this is broad and weak -->
  <path d="M 116 96 L 200 88 L 208 438 L 124 446 Z" fill="#ffffff" opacity="0.05"/>

  <!-- ribbon marker slipping out of the block -->
  <path d="M 250 82 L 258 82 L 262 462 L 252 456 Z" fill="#b03a3a" opacity="0.9"/>
  <path d="M 252 456 L 262 462 L 257 470 Z" fill="#8f2c2c"/>
</svg>
