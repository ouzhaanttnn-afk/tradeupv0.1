<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .book-cover { fill: #1e40af; stroke: #1e3a8a; stroke-width: 1; }
      .book-pages { fill: #e5e7eb; stroke: #d1d5db; stroke-width: 1; }
      .book-spine { fill: #1a3f7a; }
    </style>
  </defs>

  <!-- Front cover -->
  <rect x="20" y="30" width="120" height="180" rx="2" class="book-cover" />

  <!-- Spine (3D effect) -->
  <polygon points="140,30 150,35 150,210 140,210" class="book-spine" />

  <!-- Book pages (edge) -->
  <polygon points="140,30 145,28 145,212 140,210" fill="#c7d2e0" />

  <!-- Cover title area -->
  <rect x="30" y="50" width="100" height="80" fill="#3b82f6" opacity="0.7" rx="2" />

  <!-- Title text -->
  <text x="80" y="80" font-size="12" font-weight="bold" fill="white" text-anchor="middle">BOOK</text>
  <text x="80" y="100" font-size="10" fill="#e0e7ff" text-anchor="middle" opacity="0.9">TITLE</text>

  <!-- Author name area -->
  <text x="80" y="160" font-size="8" fill="#d1d5db" text-anchor="middle">Author Name</text>

  <!-- Decorative elements on cover -->
  <circle cx="50" cy="50" r="3" fill="#10b981" opacity="0.6" />
  <circle cx="110" cy="60" r="2" fill="#ef4444" opacity="0.6" />
  <circle cx="70" cy="180" r="2.5" fill="#f59e0b" opacity="0.6" />

  <!-- Page lines (simulated) -->
  <line x1="30" y1="200" x2="140" y2="200" stroke="#bfdbfe" stroke-width="0.5" opacity="0.5" />
  <line x1="30" y1="210" x2="140" y2="210" stroke="#bfdbfe" stroke-width="0.5" opacity="0.4" />

  <!-- Bookmark ribbon -->
  <line x1="140" y1="35" x2="140" y2="180" stroke="#ef4444" stroke-width="2" opacity="0.7" />

  <!-- Shadow for 3D -->
  <path d="M 20 210 L 140 210 L 150 212 L 30 212 Z" fill="black" opacity="0.1" />
</svg>
