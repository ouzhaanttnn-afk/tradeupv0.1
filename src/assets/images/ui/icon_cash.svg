<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .icon-stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: currentColor; }
    </style>
  </defs>

  <!-- Cash/wallet icon -->
  <g transform="translate(128, 128)">
    <!-- Wallet/purse shape -->
    <rect x="-50" y="-25" width="100" height="50" rx="6" class="icon-stroke" />

    <!-- Wallet flap -->
    <path d="M -50 -25 Q -50 -40 0 -45 Q 50 -40 50 -25" class="icon-stroke" />

    <!-- Coins inside -->
    <circle cx="-20" cy="10" r="12" class="icon-stroke" />
    <text x="-20" y="15" font-size="14" font-weight="bold" text-anchor="middle" class="icon-fill">₺</text>

    <circle cx="20" cy="5" r="10" class="icon-stroke" opacity="0.6" />
    <text x="20" y="10" font-size="12" font-weight="bold" text-anchor="middle" class="icon-fill" opacity="0.6">$</text>

    <!-- Money stack lines -->
    <line x1="-45" y1="-10" x2="45" y2="-10" class="icon-stroke" opacity="0.4" />
    <line x1="-45" y1="0" x2="45" y2="0" class="icon-stroke" opacity="0.4" />
  </g>
</svg>
