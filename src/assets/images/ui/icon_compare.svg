<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .icon-stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: currentColor; }
    </style>
  </defs>

  <!-- Comparison/balance scale icon -->
  <g transform="translate(128, 128)">
    <!-- Central pillar -->
    <rect x="-4" y="0" width="8" height="50" class="icon-stroke" />
    <circle cx="0" cy="0" r="8" class="icon-fill" />

    <!-- Left pan -->
    <rect x="-50" y="-30" width="40" height="8" rx="2" class="icon-stroke" />
    <line x1="-45" y1="-30" x2="-40" y2="0" class="icon-stroke" />
    <line x1="-30" y1="-30" x2="-25" y2="0" class="icon-stroke" />

    <!-- Right pan -->
    <rect x="10" y="-25" width="40" height="8" rx="2" class="icon-stroke" />
    <line x1="15" y1="-25" x2="20" y2="0" class="icon-stroke" />
    <line x1="30" y1="-25" x2="35" y2="0" class="icon-stroke" />

    <!-- Indicator marks -->
    <circle cx="-35" cy="-35" r="2" class="icon-fill" />
    <circle cx="25" cy="-30" r="2" class="icon-fill" />
  </g>
</svg>
