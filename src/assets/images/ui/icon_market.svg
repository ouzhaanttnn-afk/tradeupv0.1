<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .icon-stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: currentColor; }
    </style>
  </defs>

  <!-- Market stall/storefront icon -->
  <g transform="translate(128, 128)">
    <!-- Tent/canopy top -->
    <path d="M -60 -30 L -20 -60 L 20 -60 L 60 -30 Z" class="icon-stroke" />
    <line x1="-20" y1="-60" x2="-20" y2="-30" class="icon-stroke" />
    <line x1="20" y1="-60" x2="20" y2="-30" class="icon-stroke" />

    <!-- Storefront body -->
    <rect x="-60" y="-30" width="120" height="70" rx="4" class="icon-stroke" />

    <!-- Door frame -->
    <line x1="-20" y1="-30" x2="-20" y2="40" class="icon-stroke" />
    <line x1="20" y1="-30" x2="20" y2="40" class="icon-stroke" />

    <!-- Window shelves -->
    <line x1="-60" y1="-10" x2="60" y2="-10" class="icon-stroke" />
    <line x1="-60" y1="10" x2="60" y2="10" class="icon-stroke" />

    <!-- Display items (small circles) -->
    <circle cx="-35" cy="-20" r="3" class="icon-fill" />
    <circle cx="-5" cy="-20" r="3" class="icon-fill" />
    <circle cx="25" cy="-20" r="3" class="icon-fill" />
    <circle cx="-35" cy="0" r="3" class="icon-fill" />
    <circle cx="0" cy="0" r="3" class="icon-fill" />
    <circle cx="35" cy="0" r="3" class="icon-fill" />
    <circle cx="-35" cy="20" r="3" class="icon-fill" />
    <circle cx="0" cy="20" r="3" class="icon-fill" />
    <circle cx="35" cy="20" r="3" class="icon-fill" />
  </g>
</svg>
