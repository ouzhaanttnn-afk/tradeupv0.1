<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .icon-stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: currentColor; }
    </style>
  </defs>

  <!-- Magnifying glass/inspect icon -->
  <g transform="translate(128, 128)">
    <!-- Lens circle -->
    <circle cx="-15" cy="-15" r="35" class="icon-stroke" />

    <!-- Inner detail circle -->
    <circle cx="-15" cy="-15" r="20" class="icon-stroke" opacity="0.5" />

    <!-- Magnifying glass handle -->
    <line x1="15" y1="15" x2="45" y2="45" class="icon-stroke" stroke-width="2" />

    <!-- Crosshair in center for focus -->
    <line x1="-15" y1="-30" x2="-15" y2="-5" class="icon-stroke" opacity="0.5" />
    <line x1="-30" y1="-15" x2="-5" y2="-15" class="icon-stroke" opacity="0.5" />

    <!-- Detail marks -->
    <circle cx="-25" cy="-20" r="2" class="icon-fill" />
    <circle cx="-5" cy="-25" r="2" class="icon-fill" />
    <circle cx="-10" cy="-5" r="2" class="icon-fill" />
  </g>
</svg>
