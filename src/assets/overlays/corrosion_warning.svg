<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .corrosion-bg { fill: #92400e; opacity: 0.78; }
      .corrosion-particle { fill: #d97706; }
      .corrosion-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 8px; font-weight: 700; fill: #fef3c7; text-anchor: middle; }
    </style>
  </defs>

  <!-- Brown overlay -->
  <rect width="100" height="100" class="corrosion-bg" />

  <!-- Corrosion effect - irregular particles -->
  <g class="corrosion-particle" opacity="0.85">
    <circle cx="20" cy="20" r="3" />
    <ellipse cx="35" cy="25" rx="2.5" ry="3.5" />
    <polygon points="45,35 48,40 42,40" />
    <circle cx="60" cy="30" r="2.5" />
    <path d="M 70 25 Q 72 28 70 32 Q 68 28 70 25" />
  </g>

  <!-- Corrosion spread pattern -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="#d97706" stroke-width="1" opacity="0.5" stroke-dasharray="3,2" />

  <!-- Additional corrosion spots -->
  <g class="corrosion-particle" opacity="0.7">
    <circle cx="25" cy="60" r="2" />
    <circle cx="70" cy="65" r="2.5" />
    <ellipse cx="45" cy="70" rx="2" ry="3" />
    <circle cx="80" cy="45" r="1.5" />
  </g>

  <!-- Warning label -->
  <text x="50" y="92" class="corrosion-text">Corrosion</text>
</svg>
