<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .water-bg { fill: #3b82f6; opacity: 0.80; }
      .water-icon { fill: #7dd3fc; }
      .water-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 9px; font-weight: 700; fill: white; text-anchor: middle; }
    </style>
  </defs>

  <!-- Blue overlay background -->
  <rect width="100" height="100" class="water-bg" />

  <!-- Water droplets -->
  <g class="water-icon">
    <path d="M 30 25 Q 25 35 30 40 Q 35 35 30 25" />
    <path d="M 50 30 Q 45 40 50 45 Q 55 40 50 30" />
    <path d="M 70 28 Q 65 38 70 43 Q 75 38 70 28" />
    <path d="M 25 55 Q 20 65 25 70 Q 30 65 25 55" />
    <path d="M 75 60 Q 70 70 75 75 Q 80 70 75 60" />
  </g>

  <!-- Corrosion texture -->
  <circle cx="35" cy="60" r="8" class="water-icon" opacity="0.6" />
  <circle cx="60" cy="65" r="6" class="water-icon" opacity="0.5" />
  <circle cx="40" cy="40" r="5" class="water-icon" opacity="0.4" />

  <!-- Warning label -->
  <text x="50" y="92" class="water-text">WATER DAMAGE</text>
</svg>
