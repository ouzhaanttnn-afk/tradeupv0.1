<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .crack-bg { fill: #dc2626; opacity: 0.75; }
      .crack-line { stroke: #fca5a5; stroke-width: 1.5; fill: none; stroke-linecap: round; }
      .crack-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 9px; font-weight: 700; fill: white; text-anchor: middle; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Semi-transparent red overlay -->
  <rect width="100" height="100" class="crack-bg" />

  <!-- Crack pattern -->
  <path d="M 50 20 L 45 35 L 55 45 L 40 55 L 60 70" class="crack-line" />
  <path d="M 50 20 L 58 38 L 48 50 L 65 62 L 45 80" class="crack-line" />
  <path d="M 35 30 L 42 45 L 38 60 L 50 75" class="crack-line" />

  <!-- Broken glass effect -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="#fca5a5" stroke-width="1" opacity="0.5" />
  <circle cx="50" cy="50" r="10" fill="none" stroke="#fca5a5" stroke-width="0.8" opacity="0.3" />

  <!-- Label -->
  <text x="50" y="92" class="crack-text">SCREEN DAMAGED</text>
</svg>
