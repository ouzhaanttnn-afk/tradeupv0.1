<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .camera-bg { fill: #831843; opacity: 0.80; }
      .camera-icon { fill: #fbcfe8; }
      .camera-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 8px; font-weight: 700; fill: white; text-anchor: middle; }
    </style>
  </defs>

  <!-- Dark pink overlay -->
  <rect width="100" height="100" class="camera-bg" />

  <!-- Camera icon -->
  <g transform="translate(30, 28)">
    <rect x="0" y="0" width="40" height="25" rx="2" fill="none" stroke="#fbcfe8" stroke-width="1.5" />
    <circle cx="20" cy="12" r="8" fill="none" stroke="#fbcfe8" stroke-width="1" />
    <circle cx="20" cy="12" r="5" class="camera-icon" />
    <rect x="32" y="3" width="3" height="6" rx="1" class="camera-icon" />
  </g>

  <!-- Malfunction marks -->
  <line x1="35" y1="50" x2="65" y2="50" stroke="#fbcfe8" stroke-width="2" opacity="0.7" />
  <circle cx="50" cy="50" r="12" fill="none" stroke="#fbcfe8" stroke-width="1" opacity="0.4" />

  <!-- Error X -->
  <line x1="55" y1="55" x2="65" y2="65" stroke="#fbcfe8" stroke-width="1.5" opacity="0.8" />
  <line x1="65" y1="55" x2="55" y2="65" stroke="#fbcfe8" stroke-width="1.5" opacity="0.8" />

  <!-- Label -->
  <text x="50" y="92" class="camera-text">Camera Failed</text>
</svg>
