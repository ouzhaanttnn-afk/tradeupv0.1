<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .sensor-bg { fill: #7c3aed; opacity: 0.75; }
      .sensor-icon { fill: #e9d5ff; }
      .sensor-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 8px; font-weight: 700; fill: white; text-anchor: middle; letter-spacing: 0.3px; }
    </style>
  </defs>

  <!-- Purple overlay -->
  <rect width="100" height="100" class="sensor-bg" />

  <!-- Camera sensor representation -->
  <g transform="translate(35, 30)">
    <!-- Lens circle -->
    <circle cx="15" cy="15" r="12" fill="none" stroke="#e9d5ff" stroke-width="1.5" />
    <circle cx="15" cy="15" r="8" fill="none" stroke="#e9d5ff" stroke-width="1" opacity="0.7" />
    <circle cx="15" cy="15" r="4" class="sensor-icon" />
  </g>

  <!-- Dust particles -->
  <circle cx="28" cy="35" r="1.5" class="sensor-icon" opacity="0.8" />
  <circle cx="42" cy="28" r="1" class="sensor-icon" opacity="0.6" />
  <circle cx="35" cy="50" r="1.2" class="sensor-icon" opacity="0.7" />
  <circle cx="50" cy="40" r="0.8" class="sensor-icon" opacity="0.5" />
  <circle cx="30" cy="60" r="1" class="sensor-icon" opacity="0.6" />

  <!-- Warning triangle -->
  <path d="M 50 25 L 55 45 L 45 45 Z" fill="none" stroke="#e9d5ff" stroke-width="1.5" />
  <text x="50" y="42" font-size="6" font-weight="bold" text-anchor="middle" fill="#e9d5ff">!</text>

  <!-- Label -->
  <text x="50" y="92" class="sensor-text">Sensor Issue</text>
</svg>
