<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .kbd-bg { fill: #ea580c; opacity: 0.80; }
      .kbd-key { fill: white; stroke: #fca5a5; stroke-width: 0.5; }
      .kbd-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 8px; font-weight: 600; fill: white; text-anchor: middle; }
      .kbd-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 9px; font-weight: 700; fill: white; text-anchor: middle; }
    </style>
  </defs>

  <!-- Orange overlay -->
  <rect width="100" height="100" class="kbd-bg" />

  <!-- Keyboard representation -->
  <g transform="translate(15, 25)">
    <!-- Key 1 -->
    <rect x="0" y="0" width="10" height="10" rx="1" class="kbd-key" opacity="0.8" />
    <text x="5" y="7" class="kbd-text" opacity="0.7">A</text>

    <!-- Key 2 (broken) -->
    <rect x="12" y="0" width="10" height="10" rx="1" class="kbd-key" opacity="0.4" />
    <line x1="12" y1="0" x2="22" y2="10" stroke="#fca5a5" stroke-width="1.5" opacity="0.8" />
    <line x1="22" y1="0" x2="12" y2="10" stroke="#fca5a5" stroke-width="1.5" opacity="0.8" />

    <!-- Key 3 -->
    <rect x="24" y="0" width="10" height="10" rx="1" class="kbd-key" opacity="0.8" />
    <text x="29" y="7" class="kbd-text" opacity="0.7">D</text>

    <!-- Key 4 -->
    <rect x="36" y="0" width="10" height="10" rx="1" class="kbd-key" opacity="0.8" />
    <text x="41" y="7" class="kbd-text" opacity="0.7">E</text>

    <!-- Second row -->
    <rect x="0" y="14" width="10" height="10" rx="1" class="kbd-key" opacity="0.8" />
    <rect x="12" y="14" width="10" height="10" rx="1" class="kbd-key" opacity="0.8" />
    <rect x="24" y="14" width="10" height="10" rx="1" class="kbd-key" opacity="0.8" />
    <rect x="36" y="14" width="10" height="10" rx="1" class="kbd-key" opacity="0.8" />
  </g>

  <!-- Warning indicator -->
  <circle cx="70" cy="35" r="8" fill="white" opacity="0.3" />
  <path d="M 70 28 L 70 36 M 67 40 L 73 40" stroke="white" stroke-width="1.5" stroke-linecap="round" />

  <!-- Label -->
  <text x="50" y="92" class="kbd-label">Keyboard Issue</text>
</svg>
